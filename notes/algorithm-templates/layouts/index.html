<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>算法模板速查 | Notes | My Homepage</title>
    <meta name="description" content="面向 LeetCode 和面试刷题的 C++ 算法模板站。" />
    <link rel="icon" href="{{SITE_BASE_PATH}}favicon.ico" />
    <script src="assets/color-theme.js"></script>
    <link rel="stylesheet" href="./assets/styles.css" />
  </head>
  <body data-page="index" data-site-root="./">
    <header class="site-header">
      <a class="brand" href="{{SITE_BASE_PATH}}notes/">Notes</a>
      <nav class="top-nav" aria-label="页面导航">
        <a href="{{SITE_BASE_PATH}}notes/">Notes 首页</a>
        <a href="{{SITE_BASE_PATH}}notes/Data-Structures-and-Algorithms/">DSA 笔记</a>
        <a id="download-page" class="download-button" href="#" role="button">下载网页压缩包</a>
      </nav>
    </header>

    <main class="page-shell">
      <section class="hero hero--index">
        <div>
          <p class="eyebrow">LeetCode / Interview</p>
          <h1>算法模板速查</h1>
        </div>
        <div class="hero-actions">
          <label class="search-box" for="template-search">
            <span>搜索</span>
            <input id="template-search" type="search" placeholder="滑动窗口、DSU、LIS、Hot100 3..." autocomplete="off" />
          </label>
          <button id="reset-filters" class="ghost-button" type="button">全部模板</button>
        </div>
      </section>

      <section class="layout">
        <aside class="sidebar" aria-label="模板分类">
          <div class="sidebar-title">分类导航</div>
          <div id="category-list" class="category-list"></div>
        </aside>

        <section class="content-area" aria-live="polite">
          <div class="result-bar">
            <div>
              <strong id="result-count">0</strong>
              <span>个模板</span>
            </div>
            <div id="active-filter" class="active-filter">全部分类</div>
          </div>
          <div id="template-list" class="template-list"></div>
          <div id="empty-state" class="empty-state" hidden>
            没有找到匹配的模板。可以换一个关键词，或点击“全部模板”。
          </div>
        </section>
      </section>
    </main>

    <script src="./assets/jszip.min.js"></script>
    <script src="./assets/index-data.js"></script>
    <script src="./assets/app.js"></script>
  </body>
</html>

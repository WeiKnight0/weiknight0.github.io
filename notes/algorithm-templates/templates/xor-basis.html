<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>线性基：最大异或和 | 算法模板速查</title><link rel="icon" href="/favicon.ico" /><script src="../assets/color-theme.js"></script><link rel="stylesheet" href="../assets/styles.css" /></head><body data-page="template" data-site-root="../"><header class="site-header"><a class="brand" href="../index.html">算法模板速查</a><nav class="top-nav"><a href="../index.html">返回首页</a><a id="download-page" class="download-button" href="#" role="button">下载网页压缩包</a></nav></header><main class="page-shell"><article class="template-page"><p class="eyebrow">位运算</p><h1>线性基：最大异或和</h1><div class="tag-row"><span class="tag category">线性基</span><span class="tag">XOR</span><span class="tag">最大异或</span></div><section class="code-shell"><textarea class="template-source" readonly spellcheck="false">class XorBasis {
    static const int LOG = 60;
    long long basis[LOG]{};

public:
    void insert(long long x) {
        for (int i = LOG - 1; i &gt;= 0; i--) {
            if (((x &gt;&gt; i) & 1) == 0) continue;
            if (!basis[i]) {
                basis[i] = x;
                return;
            }
            x ^= basis[i];
        }
    }

    long long maxXor() {
        long long ans = 0;
        for (int i = LOG - 1; i &gt;= 0; i--) {
            ans = max(ans, ans ^ basis[i]);
        }
        return ans;
    }
};</textarea></section></article></main><script src="../assets/jszip.min.js"></script><script src="../assets/index-data.js"></script><script src="../assets/app.js"></script></body></html>

<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>判断子序列：双指针扫描 | 算法模板速查</title><link rel="icon" href="/favicon.ico" /><script src="../assets/color-theme.js"></script><link rel="stylesheet" href="../assets/styles.css" /></head><body data-page="template" data-site-root="../"><header class="site-header"><a class="brand" href="../index.html">算法模板速查</a><nav class="top-nav"><a href="../index.html">返回首页</a><a id="download-page" class="download-button" href="#" role="button">下载网页压缩包</a></nav></header><main class="page-shell"><article class="template-page"><p class="eyebrow">双指针</p><h1>判断子序列：双指针扫描</h1><div class="tag-row"><span class="tag category">子序列</span><span class="tag">双序列</span><span class="tag">贪心匹配</span></div><section class="code-shell"><textarea class="template-source" readonly spellcheck="false">bool isSubsequence(string s, string t) {
    int i = 0;
    for (char c : t) {
        if (i &lt; (int) s.size() && s[i] == c) i++;
    }
    return i == (int) s.size();
}</textarea></section></article></main><script src="../assets/jszip.min.js"></script><script src="../assets/index-data.js"></script><script src="../assets/app.js"></script></body></html>

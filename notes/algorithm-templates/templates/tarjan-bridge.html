<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Tarjan：无向图桥 | 算法模板速查</title><link rel="icon" href="/favicon.ico" /><script src="../assets/color-theme.js"></script><link rel="stylesheet" href="../assets/styles.css" /></head><body data-page="template" data-site-root="../"><header class="site-header"><a class="brand" href="../index.html">算法模板速查</a><nav class="top-nav"><a href="../index.html">返回首页</a><a id="download-page" class="download-button" href="#" role="button">下载网页压缩包</a></nav></header><main class="page-shell"><article class="template-page"><p class="eyebrow">图论</p><h1>Tarjan：无向图桥</h1><div class="tag-row"><span class="tag category">Tarjan</span><span class="tag">桥</span><span class="tag">lowlink</span></div><section class="code-shell"><textarea class="template-source" readonly spellcheck="false">vector<vector<int>> criticalConnections(int n, vector<vector<int>>& edges) {
    vector<vector<pair<int, int>>> g(n);
    for (int i = 0; i &lt; (int) edges.size(); i++) {
        int x = edges[i][0], y = edges[i][1];
        g[x].push_back({y, i});
        g[y].push_back({x, i});
    }
    vector<int> dfn(n, -1), low(n);
    vector<vector<int>> bridges;
    int timer = 0;

    function<void(int, int)> dfs = [&](int x, int parentEdge) {
        dfn[x] = low[x] = timer++;
        for (auto [y, id] : g[x]) {
            if (id == parentEdge) continue;
            if (dfn[y] == -1) {
                dfs(y, id);
                low[x] = min(low[x], low[y]);
                if (low[y] &gt; dfn[x]) bridges.push_back({x, y});
            } else {
                low[x] = min(low[x], dfn[y]);
            }
        }
    };
    for (int i = 0; i &lt; n; i++) if (dfn[i] == -1) dfs(i, -1);
    return bridges;
}</textarea></section></article></main><script src="../assets/jszip.min.js"></script><script src="../assets/index-data.js"></script><script src="../assets/app.js"></script></body></html>

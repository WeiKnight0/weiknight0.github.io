<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>最小表示法：循环同构最小串 | 算法模板速查</title><link rel="icon" href="/favicon.ico" /><script src="../assets/color-theme.js"></script><link rel="stylesheet" href="../assets/styles.css" /></head><body data-page="template" data-site-root="../"><header class="site-header"><a class="brand" href="../index.html">算法模板速查</a><nav class="top-nav"><a href="../index.html">返回首页</a><a id="download-page" class="download-button" href="#" role="button">下载网页压缩包</a></nav></header><main class="page-shell"><article class="template-page"><p class="eyebrow">字符串</p><h1>最小表示法：循环同构最小串</h1><div class="tag-row"><span class="tag category">最小表示法</span><span class="tag">循环串</span><span class="tag">字典序</span></div><section class="code-shell"><textarea class="template-source" readonly spellcheck="false">int minimumRepresentation(string s) {
    int n = s.size();
    s += s;
    int i = 0, j = 1;
    while (j &lt; n) {
        int k = 0;
        while (k &lt; n && s[i + k] == s[j + k]) k++;
        if (k == n) break;
        if (s[i + k] &lt; s[j + k]) {
            j += k + 1;
        } else {
            i = max(i + k + 1, j);
            j = i + 1;
        }
    }
    return i;
}</textarea></section></article></main><script src="../assets/jszip.min.js"></script><script src="../assets/index-data.js"></script><script src="../assets/app.js"></script></body></html>

<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>AC 自动机：多模式串匹配 | 算法模板速查</title><link rel="icon" href="/favicon.ico" /><script src="../assets/color-theme.js"></script><link rel="stylesheet" href="../assets/styles.css" /></head><body data-page="template" data-site-root="../"><header class="site-header"><a class="brand" href="../index.html">算法模板速查</a><nav class="top-nav"><a href="../index.html">返回首页</a><a id="download-page" class="download-button" href="#" role="button">下载网页压缩包</a></nav></header><main class="page-shell"><article class="template-page"><p class="eyebrow">字符串</p><h1>AC 自动机：多模式串匹配</h1><div class="tag-row"><span class="tag category">AC自动机</span><span class="tag">Trie</span><span class="tag">KMP</span></div><section class="code-shell"><textarea class="template-source" readonly spellcheck="false">class AhoCorasick {
    struct Node {
        int next[26];
        int fail = 0;
        int out = 0;
        Node() { fill(begin(next), end(next), -1); }
    };
    vector<Node> trie{Node()};

public:
    void insert(string word) {
        int node = 0;
        for (char c : word) {
            int x = c - 'a';
            if (trie[node].next[x] == -1) {
                trie[node].next[x] = trie.size();
                trie.push_back(Node());
            }
            node = trie[node].next[x];
        }
        trie[node].out++;
    }

    void build() {
        queue<int> q;
        for (int c = 0; c &lt; 26; c++) {
            int y = trie[0].next[c];
            if (y == -1) trie[0].next[c] = 0;
            else q.push(y);
        }
        while (!q.empty()) {
            int x = q.front(); q.pop();
            trie[x].out += trie[trie[x].fail].out;
            for (int c = 0; c &lt; 26; c++) {
                int y = trie[x].next[c];
                if (y == -1) trie[x].next[c] = trie[trie[x].fail].next[c];
                else {
                    trie[y].fail = trie[trie[x].fail].next[c];
                    q.push(y);
                }
            }
        }
    }

    int countMatches(string text) {
        int node = 0, ans = 0;
        for (char c : text) {
            node = trie[node].next[c - 'a'];
            ans += trie[node].out;
        }
        return ans;
    }
};</textarea></section></article></main><script src="../assets/jszip.min.js"></script><script src="../assets/index-data.js"></script><script src="../assets/app.js"></script></body></html>

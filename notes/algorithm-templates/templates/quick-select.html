<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>快速选择：第 K 大元素 | 算法模板速查</title><link rel="icon" href="/favicon.ico" /><script src="../assets/color-theme.js"></script><link rel="stylesheet" href="../assets/styles.css" /></head><body data-page="template" data-site-root="../"><header class="site-header"><a class="brand" href="../index.html">算法模板速查</a><nav class="top-nav"><a href="../index.html">返回首页</a><a id="download-page" class="download-button" href="#" role="button">下载网页压缩包</a></nav></header><main class="page-shell"><article class="template-page"><p class="eyebrow">排序与选择</p><h1>快速选择：第 K 大元素</h1><div class="tag-row"><span class="tag category">Hot100 215</span><span class="tag">TopK</span><span class="tag">快速选择</span></div><section class="code-shell"><textarea class="template-source" readonly spellcheck="false">int findKthLargest(vector<int>& nums, int k) {
    int target = nums.size() - k;
    int left = 0;
    int right = nums.size() - 1;

    while (left <= right) {
        int pivot = nums[left + (right - left) / 2];
        int i = left;
        int j = right;

        while (i <= j) {
            while (nums[i] < pivot) i++;
            while (nums[j] > pivot) j--;
            if (i <= j) swap(nums[i++], nums[j--]);
        }

        if (target <= j) right = j;
        else if (target >= i) left = i;
        else return nums[target];
    }

    return nums[target];
}</textarea></section></article></main><script src="../assets/jszip.min.js"></script><script src="../assets/index-data.js"></script><script src="../assets/app.js"></script></body></html>

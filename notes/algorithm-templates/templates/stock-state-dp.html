<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>状态机 DP：股票买卖 | 算法模板速查</title><link rel="icon" href="/favicon.ico" /><script src="../assets/color-theme.js"></script><link rel="stylesheet" href="../assets/styles.css" /></head><body data-page="template" data-site-root="../"><header class="site-header"><a class="brand" href="../index.html">算法模板速查</a><nav class="top-nav"><a href="../index.html">返回首页</a><a id="download-page" class="download-button" href="#" role="button">下载网页压缩包</a></nav></header><main class="page-shell"><article class="template-page"><p class="eyebrow">动态规划</p><h1>状态机 DP：股票买卖</h1><div class="tag-row"><span class="tag category">状态机</span><span class="tag">持有/未持有</span><span class="tag">股票</span></div><section class="code-shell"><textarea class="template-source" readonly spellcheck="false">int maxProfit(vector<int>& prices) {
    int hold = -prices[0];
    int cash = 0;
    for (int i = 1; i &lt; (int) prices.size(); i++) {
        int newCash = max(cash, hold + prices[i]);
        int newHold = max(hold, cash - prices[i]);
        cash = newCash;
        hold = newHold;
    }
    return cash;
}</textarea></section></article></main><script src="../assets/jszip.min.js"></script><script src="../assets/index-data.js"></script><script src="../assets/app.js"></script></body></html>

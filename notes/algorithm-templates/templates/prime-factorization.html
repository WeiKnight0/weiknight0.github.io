<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>质因数分解：最小质因子 LPF | 算法模板速查</title><link rel="icon" href="/favicon.ico" /><script src="../assets/color-theme.js"></script><link rel="stylesheet" href="../assets/styles.css" /></head><body data-page="template" data-site-root="../"><header class="site-header"><a class="brand" href="../index.html">算法模板速查</a><nav class="top-nav"><a href="../index.html">返回首页</a><a id="download-page" class="download-button" href="#" role="button">下载网页压缩包</a></nav></header><main class="page-shell"><article class="template-page"><p class="eyebrow">数学</p><h1>质因数分解：最小质因子 LPF</h1><div class="tag-row"><span class="tag category">数论</span><span class="tag">质因子</span><span class="tag">预处理</span></div><section class="code-shell"><textarea class="template-source" readonly spellcheck="false">vector<int> buildLpf(int n) {
    vector<int> lpf(n + 1);
    for (int i = 2; i &lt;= n; i++) {
        if (lpf[i]) continue;
        for (long long j = i; j &lt;= n; j += i) {
            if (!lpf[j]) lpf[j] = i;
        }
    }
    return lpf;
}

vector<pair<int, int>> factorize(int x, vector<int>& lpf) {
    vector<pair<int, int>> ans;
    while (x &gt; 1) {
        int p = lpf[x], e = 0;
        while (x % p == 0) {
            x /= p;
            e++;
        }
        ans.push_back({p, e});
    }
    return ans;
}</textarea></section></article></main><script src="../assets/jszip.min.js"></script><script src="../assets/index-data.js"></script><script src="../assets/app.js"></script></body></html>

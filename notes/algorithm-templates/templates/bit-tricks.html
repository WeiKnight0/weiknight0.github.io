    return x & -x;
}

vector<int> enumerateSubmasks(int mask) {
    vector<int> ans;
    for (int sub = mask; sub; sub = (sub - 1) & mask) {
        ans.push_back(sub);
    }
    ans.push_back(0);
    return ans;
}

bool hasBit(int mask, int i) {
    return mask & (1 &lt;&lt; i);

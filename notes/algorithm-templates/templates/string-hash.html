<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>字符串哈希：子串哈希 | 算法模板速查</title><link rel="icon" href="/favicon.ico" /><script src="../assets/color-theme.js"></script><link rel="stylesheet" href="../assets/styles.css" /></head><body data-page="template" data-site-root="../"><header class="site-header"><a class="brand" href="../index.html">算法模板速查</a><nav class="top-nav"><a href="../index.html">返回首页</a><a id="download-page" class="download-button" href="#" role="button">下载网页压缩包</a></nav></header><main class="page-shell"><article class="template-page"><p class="eyebrow">字符串</p><h1>字符串哈希：子串哈希</h1><div class="tag-row"><span class="tag category">滚动哈希</span><span class="tag">子串</span><span class="tag">双模可扩展</span></div><section class="code-shell"><textarea class="template-source" readonly spellcheck="false">class StringHash {
    static const long long MOD = 1000000007;
    static const long long BASE = 911382323;
    vector<long long> h, p;

public:
    StringHash(string s) {
        int n = s.size();
        h.assign(n + 1, 0);
        p.assign(n + 1, 1);
        for (int i = 0; i &lt; n; i++) {
            h[i + 1] = (h[i] * BASE + s[i]) % MOD;
            p[i + 1] = p[i] * BASE % MOD;
        }
    }

    long long get(int l, int r) {
        return (h[r] - h[l] * p[r - l] % MOD + MOD) % MOD;
    }
};</textarea></section></article></main><script src="../assets/jszip.min.js"></script><script src="../assets/index-data.js"></script><script src="../assets/app.js"></script></body></html>

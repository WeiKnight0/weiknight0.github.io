<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>线段树：区间加，区间和 | 算法模板速查</title><link rel="icon" href="/favicon.ico" /><script src="../assets/color-theme.js"></script><link rel="stylesheet" href="../assets/styles.css" /></head><body data-page="template" data-site-root="../"><header class="site-header"><a class="brand" href="../index.html">算法模板速查</a><nav class="top-nav"><a href="../index.html">返回首页</a><a id="download-page" class="download-button" href="#" role="button">下载网页压缩包</a></nav></header><main class="page-shell"><article class="template-page"><p class="eyebrow">基础容器与技巧</p><h1>线段树：区间加，区间和</h1><div class="tag-row"><span class="tag category">灵神风格</span><span class="tag">lazy</span><span class="tag">区间查询</span></div><section class="code-shell"><textarea class="template-source" readonly spellcheck="false">class SegmentTree {
    vector<long long> sum, todo;

    void do_(int o, int l, int r, long long v) {
        sum[o] += v * (r - l + 1);
        todo[o] += v;
    }

    void spread(int o, int l, int r) {
        long long v = todo[o];
        if (v == 0 || l == r) {
            return;
        }
        int m = (l + r) / 2;
        do_(o * 2, l, m, v);
        do_(o * 2 + 1, m + 1, r, v);
        todo[o] = 0;
    }

    void maintain(int o) {
        sum[o] = sum[o * 2] + sum[o * 2 + 1];
    }

    void update(int o, int l, int r, int ql, int qr, long long v) {
        if (ql &lt;= l && r &lt;= qr) {
            do_(o, l, r, v);
            return;
        }
        spread(o, l, r);
        int m = (l + r) / 2;
        if (ql &lt;= m) {
            update(o * 2, l, m, ql, qr, v);
        }
        if (m &lt; qr) {
            update(o * 2 + 1, m + 1, r, ql, qr, v);
        }
        maintain(o);
    }

    long long query(int o, int l, int r, int ql, int qr) {
        if (ql &lt;= l && r &lt;= qr) {
            return sum[o];
        }
        spread(o, l, r);
        int m = (l + r) / 2;
        long long res = 0;
        if (ql &lt;= m) {
            res += query(o * 2, l, m, ql, qr);
        }
        if (m &lt; qr) {
            res += query(o * 2 + 1, m + 1, r, ql, qr);
        }
        return res;
    }

public:
    SegmentTree(int n) : sum(n * 4), todo(n * 4) {}

    // 闭区间 [l,r]，下标从 0 开始
    void update(int n, int l, int r, long long v) {
        update(1, 0, n - 1, l, r, v);
    }

    long long query(int n, int l, int r) {
        return query(1, 0, n - 1, l, r);
    }
};</textarea></section></article></main><script src="../assets/jszip.min.js"></script><script src="../assets/index-data.js"></script><script src="../assets/app.js"></script></body></html>

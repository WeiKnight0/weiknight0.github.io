<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Kruskal：最小生成树 | 算法模板速查</title><link rel="icon" href="/favicon.ico" /><script src="../assets/color-theme.js"></script><link rel="stylesheet" href="../assets/styles.css" /></head><body data-page="template" data-site-root="../"><header class="site-header"><a class="brand" href="../index.html">算法模板速查</a><nav class="top-nav"><a href="../index.html">返回首页</a><a id="download-page" class="download-button" href="#" role="button">下载网页压缩包</a></nav></header><main class="page-shell"><article class="template-page"><p class="eyebrow">图论</p><h1>Kruskal：最小生成树</h1><div class="tag-row"><span class="tag category">灵神风格</span><span class="tag">MST</span><span class="tag">并查集</span></div><section class="code-shell"><textarea class="template-source" readonly spellcheck="false">class UnionFind {
    vector<int> fa, size;

public:
    int cc;

    UnionFind(int n) : fa(n), size(n, 1), cc(n) {
        iota(fa.begin(), fa.end(), 0);
    }

    int find(int x) {
        if (fa[x] != x) {
            fa[x] = find(fa[x]);
        }
        return fa[x];
    }

    bool merge(int from, int to) {
        int x = find(from), y = find(to);
        if (x == y) {
            return false;
        }
        fa[x] = y;
        size[y] += size[x];
        cc--;
        return true;
    }

    int getSize(int x) {
        return size[find(x)];
    }
};

long long kruskal(int n, vector<vector<int>>& edges) {
    sort(edges.begin(), edges.end(), [](auto& a, auto& b) {
        return a[2] &lt; b[2];
    });

    UnionFind uf(n);
    long long ans = 0;
    for (auto& e : edges) {
        int x = e[0], y = e[1], w = e[2];
        if (uf.merge(x, y)) {
            ans += w;
        }
    }
    return uf.cc == 1 ? ans : -1;
}</textarea></section></article></main><script src="../assets/jszip.min.js"></script><script src="../assets/index-data.js"></script><script src="../assets/app.js"></script></body></html>

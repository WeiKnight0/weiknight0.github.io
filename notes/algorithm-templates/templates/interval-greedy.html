<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>区间贪心：最多不相交区间 | 算法模板速查</title><link rel="icon" href="/favicon.ico" /><script src="../assets/color-theme.js"></script><link rel="stylesheet" href="../assets/styles.css" /></head><body data-page="template" data-site-root="../"><header class="site-header"><a class="brand" href="../index.html">算法模板速查</a><nav class="top-nav"><a href="../index.html">返回首页</a><a id="download-page" class="download-button" href="#" role="button">下载网页压缩包</a></nav></header><main class="page-shell"><article class="template-page"><p class="eyebrow">贪心</p><h1>区间贪心：最多不相交区间</h1><div class="tag-row"><span class="tag category">区间</span><span class="tag">右端点排序</span><span class="tag">活动安排</span></div><section class="code-shell"><textarea class="template-source" readonly spellcheck="false">int maxNonOverlapping(vector<vector<int>>& intervals) {
    sort(intervals.begin(), intervals.end(), [](auto& a, auto& b) {
        return a[1] &lt; b[1];
    });
    int ans = 0;
    int lastEnd = INT_MIN;
    for (auto& e : intervals) {
        if (e[0] &gt;= lastEnd) {
            ans++;
            lastEnd = e[1];
        }
    }
    return ans;
}</textarea></section></article></main><script src="../assets/jszip.min.js"></script><script src="../assets/index-data.js"></script><script src="../assets/app.js"></script></body></html>

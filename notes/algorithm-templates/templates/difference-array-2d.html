<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>二维差分：子矩阵加法 | 算法模板速查</title><link rel="icon" href="/favicon.ico" /><script src="../assets/color-theme.js"></script><link rel="stylesheet" href="../assets/styles.css" /></head><body data-page="template" data-site-root="../"><header class="site-header"><a class="brand" href="../index.html">算法模板速查</a><nav class="top-nav"><a href="../index.html">返回首页</a><a id="download-page" class="download-button" href="#" role="button">下载网页压缩包</a></nav></header><main class="page-shell"><article class="template-page"><p class="eyebrow">基础容器与技巧</p><h1>二维差分：子矩阵加法</h1><div class="tag-row"><span class="tag category">二维差分</span><span class="tag">矩阵</span><span class="tag">区间更新</span></div><section class="code-shell"><textarea class="template-source" readonly spellcheck="false">vector<vector<int>> rangeAddQueries(int n, vector<vector<int>>& queries) {
    vector<vector<int>> diff(n + 1, vector<int>(n + 1));
    for (auto& q : queries) {
        int r1 = q[0], c1 = q[1], r2 = q[2], c2 = q[3];
        diff[r1][c1]++;
        diff[r2 + 1][c1]--;
        diff[r1][c2 + 1]--;
        diff[r2 + 1][c2 + 1]++;
    }
    vector<vector<int>> ans(n, vector<int>(n));
    for (int i = 0; i &lt; n; i++) {
        for (int j = 0; j &lt; n; j++) {
            int up = i ? ans[i - 1][j] : 0;
            int left = j ? ans[i][j - 1] : 0;
            int diag = i && j ? ans[i - 1][j - 1] : 0;
            ans[i][j] = up + left - diag + diff[i][j];
        }
    }
    return ans;
}</textarea></section></article></main><script src="../assets/jszip.min.js"></script><script src="../assets/index-data.js"></script><script src="../assets/app.js"></script></body></html>

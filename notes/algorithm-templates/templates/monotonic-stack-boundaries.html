<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>单调栈：左右最近严格更大元素 | 算法模板速查</title><link rel="icon" href="/favicon.ico" /><script src="../assets/color-theme.js"></script><link rel="stylesheet" href="../assets/styles.css" /></head><body data-page="template" data-site-root="../"><header class="site-header"><a class="brand" href="../index.html">算法模板速查</a><nav class="top-nav"><a href="../index.html">返回首页</a><a id="download-page" class="download-button" href="#" role="button">下载网页压缩包</a></nav></header><main class="page-shell"><article class="template-page"><p class="eyebrow">栈与单调栈</p><h1>单调栈：左右最近严格更大元素</h1><div class="tag-row"><span class="tag category">灵神风格</span><span class="tag">左右边界</span><span class="tag">严格更大</span></div><section class="code-shell"><textarea class="template-source" readonly spellcheck="false">// left[i] 是 nums[i] 左侧最近的严格大于 nums[i] 的数的下标，若不存在则为 -1
vector<int> leftGreater(vector<int>& nums) {
    int n = nums.size();
    vector<int> left(n, -1), st;
    for (int i = 0; i &lt; n; i++) {
        while (!st.empty() && nums[st.back()] &lt;= nums[i]) { // 如果求严格小于，改成 &gt;=
            st.pop_back();
        }
        if (!st.empty()) left[i] = st.back();
        st.push_back(i);
    }
    return left;
}

// right[i] 是 nums[i] 右侧最近的严格大于 nums[i] 的数的下标，若不存在则为 n
vector<int> rightGreater(vector<int>& nums) {
    int n = nums.size();
    vector<int> right(n, n), st;
    for (int i = n - 1; i &gt;= 0; i--) {
        while (!st.empty() && nums[st.back()] &lt;= nums[i]) { // 如果求严格小于，改成 &gt;=
            st.pop_back();
        }
        if (!st.empty()) right[i] = st.back();
        st.push_back(i);
    }
    return right;
}</textarea></section></article></main><script src="../assets/jszip.min.js"></script><script src="../assets/index-data.js"></script><script src="../assets/app.js"></script></body></html>

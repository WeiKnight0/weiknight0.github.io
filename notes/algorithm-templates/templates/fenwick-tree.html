<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Fenwick 树状数组：单点加，前缀和 | 算法模板速查</title><link rel="icon" href="/favicon.ico" /><script src="../assets/color-theme.js"></script><link rel="stylesheet" href="../assets/styles.css" /></head><body data-page="template" data-site-root="../"><header class="site-header"><a class="brand" href="../index.html">算法模板速查</a><nav class="top-nav"><a href="../index.html">返回首页</a><a id="download-page" class="download-button" href="#" role="button">下载网页压缩包</a></nav></header><main class="page-shell"><article class="template-page"><p class="eyebrow">基础容器与技巧</p><h1>Fenwick 树状数组：单点加，前缀和</h1><div class="tag-row"><span class="tag category">灵神风格</span><span class="tag">1-indexed</span><span class="tag">前缀和</span></div><section class="code-shell"><textarea class="template-source" readonly spellcheck="false">class Fenwick {
    vector<long long> tree;

public:
    Fenwick(int n) : tree(n + 1) {}

    // 下标从 1 开始：把 a[i] 增加 val
    void add(int i, long long val) {
        for (; i &lt; tree.size(); i += i & -i) {
            tree[i] += val;
        }
    }

    // 返回 a[1] + ... + a[i]
    long long pre(int i) {
        long long res = 0;
        for (; i &gt; 0; i &= i - 1) {
            res += tree[i];
        }
        return res;
    }

    long long query(int l, int r) {
        if (r &lt; l) {
            return 0;
        }
        return pre(r) - pre(l - 1);
    }
};</textarea></section></article></main><script src="../assets/jszip.min.js"></script><script src="../assets/index-data.js"></script><script src="../assets/app.js"></script></body></html>

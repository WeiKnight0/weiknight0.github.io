<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>邻接表 BFS：无权图最短路 | 算法模板速查</title><link rel="icon" href="/favicon.ico" /><script src="../assets/color-theme.js"></script><link rel="stylesheet" href="../assets/styles.css" /></head><body data-page="template" data-site-root="../"><header class="site-header"><a class="brand" href="../index.html">算法模板速查</a><nav class="top-nav"><a href="../index.html">返回首页</a><a id="download-page" class="download-button" href="#" role="button">下载网页压缩包</a></nav></header><main class="page-shell"><article class="template-page"><p class="eyebrow">图论</p><h1>邻接表 BFS：无权图最短路</h1><div class="tag-row"><span class="tag category">灵神风格</span><span class="tag">邻接表</span><span class="tag">无权图</span></div><section class="code-shell"><textarea class="template-source" readonly spellcheck="false">vector<int> bfs(vector<vector<int>>& g, int start) {
    int n = g.size();
    vector<int> dis(n, -1);
    queue<int> q;
    dis[start] = 0;
    q.push(start);

    while (!q.empty()) {
        int x = q.front();
        q.pop();
        for (int y : g[x]) {
            if (dis[y] &lt; 0) {
                dis[y] = dis[x] + 1;
                q.push(y);
            }
        }
    }
    return dis;
}</textarea></section></article></main><script src="../assets/jszip.min.js"></script><script src="../assets/index-data.js"></script><script src="../assets/app.js"></script></body></html>

<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>恰好型滑动窗口：atMost(k) 相减 | 算法模板速查</title><link rel="icon" href="/favicon.ico" /><script src="../assets/color-theme.js"></script><link rel="stylesheet" href="../assets/styles.css" /></head><body data-page="template" data-site-root="../"><header class="site-header"><a class="brand" href="../index.html">算法模板速查</a><nav class="top-nav"><a href="../index.html">返回首页</a><a id="download-page" class="download-button" href="#" role="button">下载网页压缩包</a></nav></header><main class="page-shell"><article class="template-page"><p class="eyebrow">滑动窗口</p><h1>恰好型滑动窗口：atMost(k) 相减</h1><div class="tag-row"><span class="tag category">恰好K</span><span class="tag">至多</span><span class="tag">计数</span></div><section class="code-shell"><textarea class="template-source" readonly spellcheck="false">long long subarraysWithExactlyK(vector<int>& nums, int k) {
    auto atMost = [&](int limit) -&gt; long long {
        if (limit &lt; 0) return 0;
        long long ans = 0;
        unordered_map<int, int> cnt;
        int left = 0;
        for (int right = 0; right &lt; (int) nums.size(); right++) {
            if (cnt[nums[right]]++ == 0) limit--;
            while (limit &lt; 0) {
                if (--cnt[nums[left]] == 0) limit++;
                left++;
            }
            ans += right - left + 1;
        }
        return ans;
    };
    return atMost(k) - atMost(k - 1);
}</textarea></section></article></main><script src="../assets/jszip.min.js"></script><script src="../assets/index-data.js"></script><script src="../assets/app.js"></script></body></html>

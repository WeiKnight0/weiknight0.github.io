<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>网格图 DFS：统计连通块大小 | 算法模板速查</title><link rel="icon" href="/favicon.ico" /><script src="../assets/color-theme.js"></script><link rel="stylesheet" href="../assets/styles.css" /></head><body data-page="template" data-site-root="../"><header class="site-header"><a class="brand" href="../index.html">算法模板速查</a><nav class="top-nav"><a href="../index.html">返回首页</a><a id="download-page" class="download-button" href="#" role="button">下载网页压缩包</a></nav></header><main class="page-shell"><article class="template-page"><p class="eyebrow">图论</p><h1>网格图 DFS：统计连通块大小</h1><div class="tag-row"><span class="tag category">灵神风格</span><span class="tag">DFS</span><span class="tag">网格图</span></div><section class="code-shell"><textarea class="template-source" readonly spellcheck="false">int DIRS[5] = {-1, 0, 1, 0, -1};

int dfs(vector<vector<int>>& grid, int i, int j) {
    int m = grid.size(), n = grid[0].size();
    if (i &lt; 0 || i &gt;= m || j &lt; 0 || j &gt;= n || grid[i][j] == 0) {
        return 0;
    }
    grid[i][j] = 0; // 标记访问过，避免重复搜索
    int res = 1;
    for (int k = 0; k &lt; 4; k++) {
        res += dfs(grid, i + DIRS[k], j + DIRS[k + 1]);
    }
    return res;
}

vector<int> componentSizes(vector<vector<int>>& grid) {
    vector<int> ans;
    for (int i = 0; i &lt; grid.size(); i++) {
        for (int j = 0; j &lt; grid[i].size(); j++) {
            if (grid[i][j]) {
                ans.push_back(dfs(grid, i, j));
            }
        }
    }
    return ans;
}</textarea></section></article></main><script src="../assets/jszip.min.js"></script><script src="../assets/index-data.js"></script><script src="../assets/app.js"></script></body></html>

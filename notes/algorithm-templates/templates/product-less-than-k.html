<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>计数型滑动窗口：乘积小于 K | 算法模板速查</title><link rel="icon" href="/favicon.ico" /><script src="../assets/color-theme.js"></script><link rel="stylesheet" href="../assets/styles.css" /></head><body data-page="template" data-site-root="../"><header class="site-header"><a class="brand" href="../index.html">算法模板速查</a><nav class="top-nav"><a href="../index.html">返回首页</a><a id="download-page" class="download-button" href="#" role="button">下载网页压缩包</a></nav></header><main class="page-shell"><article class="template-page"><p class="eyebrow">滑动窗口</p><h1>计数型滑动窗口：乘积小于 K</h1><div class="tag-row"><span class="tag category">713</span><span class="tag">越短越合法</span><span class="tag">贡献 right-left+1</span></div><section class="code-shell"><textarea class="template-source" readonly spellcheck="false">int numSubarrayProductLessThanK(vector<int>& nums, int k) {
    if (k <= 1) return 0;

    int ans = 0;
    int left = 0;
    long long product = 1;

    for (int right = 0; right < (int)nums.size(); right++) {
        product *= nums[right];

        while (product >= k) {
            product /= nums[left];
            left++;
        }

        ans += right - left + 1;
    }

    return ans;
}</textarea></section></article></main><script src="../assets/jszip.min.js"></script><script src="../assets/index-data.js"></script><script src="../assets/app.js"></script></body></html>

<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>最大子数组和：Kadane | 算法模板速查</title><link rel="icon" href="/favicon.ico" /><script src="../assets/color-theme.js"></script><link rel="stylesheet" href="../assets/styles.css" /></head><body data-page="template" data-site-root="../"><header class="site-header"><a class="brand" href="../index.html">算法模板速查</a><nav class="top-nav"><a href="../index.html">返回首页</a><a id="download-page" class="download-button" href="#" role="button">下载网页压缩包</a></nav></header><main class="page-shell"><article class="template-page"><p class="eyebrow">动态规划</p><h1>最大子数组和：Kadane</h1><div class="tag-row"><span class="tag category">Hot100 53</span><span class="tag">Kadane</span><span class="tag">连续子数组</span></div><section class="code-shell"><textarea class="template-source" readonly spellcheck="false">int maxSubArray(vector<int>& nums) {
    int best = nums[0];
    int cur = 0;

    for (int x : nums) {
        cur = max(x, cur + x);
        best = max(best, cur);
    }

    return best;
}</textarea></section></article></main><script src="../assets/jszip.min.js"></script><script src="../assets/index-data.js"></script><script src="../assets/app.js"></script></body></html>

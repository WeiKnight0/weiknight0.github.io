<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>子序列自动机：next 位置预处理 | 算法模板速查</title><link rel="icon" href="/favicon.ico" /><script src="../assets/color-theme.js"></script><link rel="stylesheet" href="../assets/styles.css" /></head><body data-page="template" data-site-root="../"><header class="site-header"><a class="brand" href="../index.html">算法模板速查</a><nav class="top-nav"><a href="../index.html">返回首页</a><a id="download-page" class="download-button" href="#" role="button">下载网页压缩包</a></nav></header><main class="page-shell"><article class="template-page"><p class="eyebrow">字符串</p><h1>子序列自动机：next 位置预处理</h1><div class="tag-row"><span class="tag category">子序列自动机</span><span class="tag">next</span><span class="tag">多次查询</span></div><section class="code-shell"><textarea class="template-source" readonly spellcheck="false">class SubsequenceAutomaton {
    vector<array<int, 26>> nxt;

public:
    SubsequenceAutomaton(string s) {
        int n = s.size();
        nxt.assign(n + 2, {});
        nxt[n].fill(n);
        for (int i = n - 1; i &gt;= 0; i--) {
            nxt[i] = nxt[i + 1];
            nxt[i][s[i] - 'a'] = i;
        }
    }

    bool contains(string t) {
        int pos = 0, n = nxt.size() - 2;
        for (char c : t) {
            pos = nxt[pos][c - 'a'];
            if (pos == n) return false;
            pos++;
        }
        return true;
    }
};</textarea></section></article></main><script src="../assets/jszip.min.js"></script><script src="../assets/index-data.js"></script><script src="../assets/app.js"></script></body></html>

<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>GCD / LCM：最大公约数与最小公倍数 | 算法模板速查</title><link rel="icon" href="/favicon.ico" /><script src="../assets/color-theme.js"></script><link rel="stylesheet" href="../assets/styles.css" /></head><body data-page="template" data-site-root="../"><header class="site-header"><a class="brand" href="../index.html">算法模板速查</a><nav class="top-nav"><a href="../index.html">返回首页</a><a id="download-page" class="download-button" href="#" role="button">下载网页压缩包</a></nav></header><main class="page-shell"><article class="template-page"><p class="eyebrow">数学</p><h1>GCD / LCM：最大公约数与最小公倍数</h1><div class="tag-row"><span class="tag category">数论</span><span class="tag">欧几里得</span><span class="tag">裴蜀</span></div><section class="code-shell"><textarea class="template-source" readonly spellcheck="false">long long gcdLong(long long a, long long b) {
    while (b) {
        long long t = a % b;
        a = b;
        b = t;
    }
    return abs(a);
}

long long lcmLong(long long a, long long b) {
    return a / gcdLong(a, b) * b;
}</textarea></section></article></main><script src="../assets/jszip.min.js"></script><script src="../assets/index-data.js"></script><script src="../assets/app.js"></script></body></html>

<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>邻接表 DFS：遍历连通块 | 算法模板速查</title><link rel="icon" href="/favicon.ico" /><script src="../assets/color-theme.js"></script><link rel="stylesheet" href="../assets/styles.css" /></head><body data-page="template" data-site-root="../"><header class="site-header"><a class="brand" href="../index.html">算法模板速查</a><nav class="top-nav"><a href="../index.html">返回首页</a><a id="download-page" class="download-button" href="#" role="button">下载网页压缩包</a></nav></header><main class="page-shell"><article class="template-page"><p class="eyebrow">图论</p><h1>邻接表 DFS：遍历连通块</h1><div class="tag-row"><span class="tag category">灵神风格</span><span class="tag">邻接表</span><span class="tag">DFS</span></div><section class="code-shell"><textarea class="template-source" readonly spellcheck="false">vector<vector<int>> g;
vector<int> vis;

void dfs(int x) {
    vis[x] = true;
    for (int y : g[x]) {
        if (!vis[y]) {
            dfs(y);
        }
    }
}

int countComponents(int n, vector<vector<int>>& edges) {
    g.assign(n, {});
    for (auto& e : edges) {
        int x = e[0], y = e[1];
        g[x].push_back(y);
        g[y].push_back(x);
    }

    vis.assign(n, false);
    int ans = 0;
    for (int i = 0; i &lt; n; i++) {
        if (!vis[i]) {
            ans++;
            dfs(i);
        }
    }
    return ans;
}</textarea></section></article></main><script src="../assets/jszip.min.js"></script><script src="../assets/index-data.js"></script><script src="../assets/app.js"></script></body></html>

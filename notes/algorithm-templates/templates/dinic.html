<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Dinic：最大流 | 算法模板速查</title><link rel="icon" href="/favicon.ico" /><script src="../assets/color-theme.js"></script><link rel="stylesheet" href="../assets/styles.css" /></head><body data-page="template" data-site-root="../"><header class="site-header"><a class="brand" href="../index.html">算法模板速查</a><nav class="top-nav"><a href="../index.html">返回首页</a><a id="download-page" class="download-button" href="#" role="button">下载网页压缩包</a></nav></header><main class="page-shell"><article class="template-page"><p class="eyebrow">图论</p><h1>Dinic：最大流</h1><div class="tag-row"><span class="tag category">网络流</span><span class="tag">最大流</span><span class="tag">分层图</span></div><section class="code-shell"><textarea class="template-source" readonly spellcheck="false">class Dinic {
    struct Edge { int to, rev; long long cap; };
    int n;
    vector<vector<Edge>> g;
    vector<int> level, it;

    bool bfs(int s, int t) {
        fill(level.begin(), level.end(), -1);
        queue<int> q;
        level[s] = 0;
        q.push(s);
        while (!q.empty()) {
            int x = q.front(); q.pop();
            for (auto& e : g[x]) if (e.cap &gt; 0 && level[e.to] &lt; 0) {
                level[e.to] = level[x] + 1;
                q.push(e.to);
            }
        }
        return level[t] &gt;= 0;
    }

    long long dfs(int x, int t, long long f) {
        if (x == t) return f;
        for (int& i = it[x]; i &lt; (int) g[x].size(); i++) {
            Edge& e = g[x][i];
            if (e.cap &gt; 0 && level[e.to] == level[x] + 1) {
                long long ret = dfs(e.to, t, min(f, e.cap));
                if (ret) {
                    e.cap -= ret;
                    g[e.to][e.rev].cap += ret;
                    return ret;
                }
            }
        }
        return 0;
    }

public:
    Dinic(int n) : n(n), g(n), level(n), it(n) {}
    void addEdge(int from, int to, long long cap) {
        Edge a{to, (int) g[to].size(), cap};
        Edge b{from, (int) g[from].size(), 0};
        g[from].push_back(a);
        g[to].push_back(b);
    }
    long long maxFlow(int s, int t) {
        long long flow = 0, f;
        while (bfs(s, t)) {
            fill(it.begin(), it.end(), 0);
            while ((f = dfs(s, t, LLONG_MAX))) flow += f;
        }
        return flow;
    }
};</textarea></section></article></main><script src="../assets/jszip.min.js"></script><script src="../assets/index-data.js"></script><script src="../assets/app.js"></script></body></html>

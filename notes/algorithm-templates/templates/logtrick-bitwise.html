<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>LogTrick：子数组 OR 去重 | 算法模板速查</title><link rel="icon" href="/favicon.ico" /><script src="../assets/color-theme.js"></script><link rel="stylesheet" href="../assets/styles.css" /></head><body data-page="template" data-site-root="../"><header class="site-header"><a class="brand" href="../index.html">算法模板速查</a><nav class="top-nav"><a href="../index.html">返回首页</a><a id="download-page" class="download-button" href="#" role="button">下载网页压缩包</a></nav></header><main class="page-shell"><article class="template-page"><p class="eyebrow">位运算</p><h1>LogTrick：子数组 OR 去重</h1><div class="tag-row"><span class="tag category">AND/OR</span><span class="tag">LogTrick</span><span class="tag">子数组</span></div><section class="code-shell"><textarea class="template-source" readonly spellcheck="false">vector<int> distinctSubarrayORs(vector<int>& nums) {
    vector<pair<int, int>> cur;
    vector<int> all;
    for (int i = 0; i &lt; (int) nums.size(); i++) {
        for (auto& p : cur) p.first |= nums[i];
        cur.push_back({nums[i], i});

        int write = 0;
        for (auto p : cur) {
            if (write == 0 || cur[write - 1].first != p.first) cur[write++] = p;
        }
        cur.resize(write);
        for (auto [v, left] : cur) all.push_back(v);
    }
    sort(all.begin(), all.end());
    all.erase(unique(all.begin(), all.end()), all.end());
    return all;
}</textarea></section></article></main><script src="../assets/jszip.min.js"></script><script src="../assets/index-data.js"></script><script src="../assets/app.js"></script></body></html>

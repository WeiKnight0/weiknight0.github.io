<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>最小覆盖子串：缺口计数 | 算法模板速查</title><link rel="icon" href="/favicon.ico" /><script src="../assets/color-theme.js"></script><link rel="stylesheet" href="../assets/styles.css" /></head><body data-page="template" data-site-root="../"><header class="site-header"><a class="brand" href="../index.html">算法模板速查</a><nav class="top-nav"><a href="../index.html">返回首页</a><a id="download-page" class="download-button" href="#" role="button">下载网页压缩包</a></nav></header><main class="page-shell"><article class="template-page"><p class="eyebrow">滑动窗口</p><h1>最小覆盖子串：缺口计数</h1><div class="tag-row"><span class="tag category">Hot100 76</span><span class="tag">最短窗口</span><span class="tag">字符串</span></div><section class="code-shell"><textarea class="template-source" readonly spellcheck="false">string minWindow(string s, string t) {
    vector<int> need(128, 0);
    for (char c : t) need[c]++;

    int missing = t.size();
    int left = 0;
    int bestLeft = 0;
    int bestLen = INT_MAX;

    for (int right = 0; right < (int)s.size(); right++) {
        if (need[s[right]] > 0) missing--;
        need[s[right]]--;

        while (missing == 0) {
            int len = right - left + 1;
            if (len < bestLen) {
                bestLen = len;
                bestLeft = left;
            }

            need[s[left]]++;
            if (need[s[left]] > 0) missing++;
            left++;
        }
    }

    return bestLen == INT_MAX ? "" : s.substr(bestLeft, bestLen);
}</textarea></section></article></main><script src="../assets/jszip.min.js"></script><script src="../assets/index-data.js"></script><script src="../assets/app.js"></script></body></html>

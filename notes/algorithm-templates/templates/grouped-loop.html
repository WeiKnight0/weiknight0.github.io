<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>分组循环：按连续段处理 | 算法模板速查</title><link rel="icon" href="/favicon.ico" /><script src="../assets/color-theme.js"></script><link rel="stylesheet" href="../assets/styles.css" /></head><body data-page="template" data-site-root="../"><header class="site-header"><a class="brand" href="../index.html">算法模板速查</a><nav class="top-nav"><a href="../index.html">返回首页</a><a id="download-page" class="download-button" href="#" role="button">下载网页压缩包</a></nav></header><main class="page-shell"><article class="template-page"><p class="eyebrow">双指针</p><h1>分组循环：按连续段处理</h1><div class="tag-row"><span class="tag category">分组循环</span><span class="tag">连续段</span><span class="tag">一次遍历</span></div><section class="code-shell"><textarea class="template-source" readonly spellcheck="false">int longestGroup(vector<int>& nums) {
    int n = nums.size();
    int ans = 0;
    int i = 0;
    while (i &lt; n) {
        int start = i;
        i++;
        while (i &lt; n && nums[i] == nums[i - 1]) {
            i++;
        }
        ans = max(ans, i - start);
    }
    return ans;
}</textarea></section></article></main><script src="../assets/jszip.min.js"></script><script src="../assets/index-data.js"></script><script src="../assets/app.js"></script></body></html>

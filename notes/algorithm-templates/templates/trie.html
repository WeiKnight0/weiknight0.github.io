<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Trie 字典树：小写字母版 | 算法模板速查</title><link rel="icon" href="/favicon.ico" /><script src="../assets/color-theme.js"></script><link rel="stylesheet" href="../assets/styles.css" /></head><body data-page="template" data-site-root="../"><header class="site-header"><a class="brand" href="../index.html">算法模板速查</a><nav class="top-nav"><a href="../index.html">返回首页</a><a id="download-page" class="download-button" href="#" role="button">下载网页压缩包</a></nav></header><main class="page-shell"><article class="template-page"><p class="eyebrow">字符串</p><h1>Trie 字典树：小写字母版</h1><div class="tag-row"><span class="tag category">灵神风格</span><span class="tag">前缀</span><span class="tag">计数</span></div><section class="code-shell"><textarea class="template-source" readonly spellcheck="false">struct Node {
    Node* son[26]{};
    int cnt = 0;
};

class Trie {
    Node* root = new Node();

    Node* find(string word) {
        Node* cur = root;
        for (char c : word) {
            c -= 'a';
            if (cur-&gt;son[c] == nullptr) {
                return nullptr;
            }
            cur = cur-&gt;son[c];
        }
        return cur;
    }

public:
    void insert(string word) {
        Node* cur = root;
        for (char c : word) {
            c -= 'a';
            if (cur-&gt;son[c] == nullptr) {
                cur-&gt;son[c] = new Node();
            }
            cur = cur-&gt;son[c];
        }
        cur-&gt;cnt++;
    }

    bool search(string word) {
        Node* node = find(word);
        return node && node-&gt;cnt &gt; 0;
    }

    bool startsWith(string prefix) {
        return find(prefix) != nullptr;
    }
};</textarea></section></article></main><script src="../assets/jszip.min.js"></script><script src="../assets/index-data.js"></script><script src="../assets/app.js"></script></body></html>

<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>拓扑序 DP：DAG 最长路 | 算法模板速查</title><link rel="icon" href="/favicon.ico" /><script src="../assets/color-theme.js"></script><link rel="stylesheet" href="../assets/styles.css" /></head><body data-page="template" data-site-root="../"><header class="site-header"><a class="brand" href="../index.html">算法模板速查</a><nav class="top-nav"><a href="../index.html">返回首页</a><a id="download-page" class="download-button" href="#" role="button">下载网页压缩包</a></nav></header><main class="page-shell"><article class="template-page"><p class="eyebrow">图论</p><h1>拓扑序 DP：DAG 最长路</h1><div class="tag-row"><span class="tag category">拓扑DP</span><span class="tag">DAG</span><span class="tag">刷表</span></div><section class="code-shell"><textarea class="template-source" readonly spellcheck="false">vector<int> longestPathDAG(int n, vector<vector<int>>& edges) {
    vector<vector<int>> g(n);
    vector<int> indeg(n), dp(n);
    for (auto& e : edges) {
        g[e[0]].push_back(e[1]);
        indeg[e[1]]++;
    }
    queue<int> q;
    for (int i = 0; i &lt; n; i++) if (indeg[i] == 0) q.push(i);
    while (!q.empty()) {
        int x = q.front(); q.pop();
        for (int y : g[x]) {
            dp[y] = max(dp[y], dp[x] + 1);
            if (--indeg[y] == 0) q.push(y);
        }
    }
    return dp;
}</textarea></section></article></main><script src="../assets/jszip.min.js"></script><script src="../assets/index-data.js"></script><script src="../assets/app.js"></script></body></html>

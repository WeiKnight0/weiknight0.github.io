<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>柱状图最大矩形：单调栈 | 算法模板速查</title><link rel="icon" href="/favicon.ico" /><script src="../assets/color-theme.js"></script><link rel="stylesheet" href="../assets/styles.css" /></head><body data-page="template" data-site-root="../"><header class="site-header"><a class="brand" href="../index.html">算法模板速查</a><nav class="top-nav"><a href="../index.html">返回首页</a><a id="download-page" class="download-button" href="#" role="button">下载网页压缩包</a></nav></header><main class="page-shell"><article class="template-page"><p class="eyebrow">栈与单调栈</p><h1>柱状图最大矩形：单调栈</h1><div class="tag-row"><span class="tag category">矩形</span><span class="tag">单调递增栈</span><span class="tag">哨兵</span></div><section class="code-shell"><textarea class="template-source" readonly spellcheck="false">int largestRectangleArea(vector<int>& heights) {
    heights.push_back(0);
    vector<int> st;
    int ans = 0;
    for (int i = 0; i &lt; (int) heights.size(); i++) {
        while (!st.empty() && heights[st.back()] &gt; heights[i]) {
            int h = heights[st.back()];
            st.pop_back();
            int left = st.empty() ? -1 : st.back();
            ans = max(ans, h * (i - left - 1));
        }
        st.push_back(i);
    }
    heights.pop_back();
    return ans;
}</textarea></section></article></main><script src="../assets/jszip.min.js"></script><script src="../assets/index-data.js"></script><script src="../assets/app.js"></script></body></html>

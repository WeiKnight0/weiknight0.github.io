<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>0-1 BFS：边权只有 0 和 1 | 算法模板速查</title><link rel="icon" href="/favicon.ico" /><script src="../assets/color-theme.js"></script><link rel="stylesheet" href="../assets/styles.css" /></head><body data-page="template" data-site-root="../"><header class="site-header"><a class="brand" href="../index.html">算法模板速查</a><nav class="top-nav"><a href="../index.html">返回首页</a><a id="download-page" class="download-button" href="#" role="button">下载网页压缩包</a></nav></header><main class="page-shell"><article class="template-page"><p class="eyebrow">图论</p><h1>0-1 BFS：边权只有 0 和 1</h1><div class="tag-row"><span class="tag category">最短路</span><span class="tag">deque</span><span class="tag">0-1 BFS</span></div><section class="code-shell"><textarea class="template-source" readonly spellcheck="false">vector<int> zeroOneBfs(int n, vector<vector<pair<int, int>>>& g, int start) {
    const int INF = 1e9;
    vector<int> dist(n, INF);
    deque<int> q;
    dist[start] = 0;
    q.push_front(start);

    while (!q.empty()) {
        int x = q.front();
        q.pop_front();
        for (auto [y, w] : g[x]) {
            if (dist[x] + w &lt; dist[y]) {
                dist[y] = dist[x] + w;
                if (w == 0) q.push_front(y);
                else q.push_back(y);
            }
        }
    }
    return dist;
}</textarea></section></article></main><script src="../assets/jszip.min.js"></script><script src="../assets/index-data.js"></script><script src="../assets/app.js"></script></body></html>

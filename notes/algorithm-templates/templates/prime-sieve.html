<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>质数筛：埃氏筛 | 算法模板速查</title><link rel="icon" href="/favicon.ico" /><script src="../assets/color-theme.js"></script><link rel="stylesheet" href="../assets/styles.css" /></head><body data-page="template" data-site-root="../"><header class="site-header"><a class="brand" href="../index.html">算法模板速查</a><nav class="top-nav"><a href="../index.html">返回首页</a><a id="download-page" class="download-button" href="#" role="button">下载网页压缩包</a></nav></header><main class="page-shell"><article class="template-page"><p class="eyebrow">数学</p><h1>质数筛：埃氏筛</h1><div class="tag-row"><span class="tag category">数论</span><span class="tag">质数</span><span class="tag">预处理</span></div><section class="code-shell"><textarea class="template-source" readonly spellcheck="false">vector<int> sieve(int n) {
    vector<int> primes;
    vector<bool> isPrime(n + 1, true);
    if (n &gt;= 0) isPrime[0] = false;
    if (n &gt;= 1) isPrime[1] = false;
    for (int i = 2; i &lt;= n; i++) {
        if (!isPrime[i]) continue;
        primes.push_back(i);
        if ((long long) i * i &lt;= n) {
            for (long long j = (long long) i * i; j &lt;= n; j += i) isPrime[j] = false;
        }
    }
    return primes;
}</textarea></section></article></main><script src="../assets/jszip.min.js"></script><script src="../assets/index-data.js"></script><script src="../assets/app.js"></script></body></html>

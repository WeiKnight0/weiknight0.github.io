<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>凸包：Andrew 算法 | 算法模板速查</title><link rel="icon" href="/favicon.ico" /><script src="../assets/color-theme.js"></script><link rel="stylesheet" href="../assets/styles.css" /></head><body data-page="template" data-site-root="../"><header class="site-header"><a class="brand" href="../index.html">算法模板速查</a><nav class="top-nav"><a href="../index.html">返回首页</a><a id="download-page" class="download-button" href="#" role="button">下载网页压缩包</a></nav></header><main class="page-shell"><article class="template-page"><p class="eyebrow">数学</p><h1>凸包：Andrew 算法</h1><div class="tag-row"><span class="tag category">计算几何</span><span class="tag">凸包</span><span class="tag">叉积</span></div><section class="code-shell"><textarea class="template-source" readonly spellcheck="false">long long cross(vector<int>& o, vector<int>& a, vector<int>& b) {
    return 1LL * (a[0] - o[0]) * (b[1] - o[1]) - 1LL * (a[1] - o[1]) * (b[0] - o[0]);
}

vector<vector<int>> convexHull(vector<vector<int>>& points) {
    sort(points.begin(), points.end());
    points.erase(unique(points.begin(), points.end()), points.end());
    if (points.size() &lt;= 1) return points;

    vector<vector<int>> hull;
    for (auto& p : points) {
        while (hull.size() &gt;= 2 && cross(hull[hull.size() - 2], hull.back(), p) &lt; 0) hull.pop_back();
        hull.push_back(p);
    }
    int lower = hull.size();
    for (int i = (int) points.size() - 2; i &gt;= 0; i--) {
        auto& p = points[i];
        while ((int) hull.size() &gt; lower && cross(hull[hull.size() - 2], hull.back(), p) &lt; 0) hull.pop_back();
        hull.push_back(p);
    }
    hull.pop_back();
    return hull;
}</textarea></section></article></main><script src="../assets/jszip.min.js"></script><script src="../assets/index-data.js"></script><script src="../assets/app.js"></script></body></html>

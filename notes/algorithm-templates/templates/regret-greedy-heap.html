<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>反悔贪心：堆维护可替换选择 | 算法模板速查</title><link rel="icon" href="/favicon.ico" /><script src="../assets/color-theme.js"></script><link rel="stylesheet" href="../assets/styles.css" /></head><body data-page="template" data-site-root="../"><header class="site-header"><a class="brand" href="../index.html">算法模板速查</a><nav class="top-nav"><a href="../index.html">返回首页</a><a id="download-page" class="download-button" href="#" role="button">下载网页压缩包</a></nav></header><main class="page-shell"><article class="template-page"><p class="eyebrow">贪心</p><h1>反悔贪心：堆维护可替换选择</h1><div class="tag-row"><span class="tag category">反悔贪心</span><span class="tag">堆</span><span class="tag">课程表III</span></div><section class="code-shell"><textarea class="template-source" readonly spellcheck="false">int scheduleCourse(vector<vector<int>>& courses) {
    sort(courses.begin(), courses.end(), [](auto& a, auto& b) {
        return a[1] &lt; b[1];
    });
    priority_queue<int> chosen;
    int total = 0;
    for (auto& c : courses) {
        int duration = c[0], deadline = c[1];
        total += duration;
        chosen.push(duration);
        if (total &gt; deadline) {
            total -= chosen.top();
            chosen.pop();
        }
    }
    return chosen.size();
}</textarea></section></article></main><script src="../assets/jszip.min.js"></script><script src="../assets/index-data.js"></script><script src="../assets/app.js"></script></body></html>

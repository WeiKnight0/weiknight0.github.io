<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Manacher：回文半径 | 算法模板速查</title><link rel="icon" href="/favicon.ico" /><script src="../assets/color-theme.js"></script><link rel="stylesheet" href="../assets/styles.css" /></head><body data-page="template" data-site-root="../"><header class="site-header"><a class="brand" href="../index.html">算法模板速查</a><nav class="top-nav"><a href="../index.html">返回首页</a><a id="download-page" class="download-button" href="#" role="button">下载网页压缩包</a></nav></header><main class="page-shell"><article class="template-page"><p class="eyebrow">字符串</p><h1>Manacher：回文半径</h1><div class="tag-row"><span class="tag category">回文串</span><span class="tag">O(n)</span><span class="tag">中心扩展</span></div><section class="code-shell"><textarea class="template-source" readonly spellcheck="false">vector<int> manacher(string s) {
    string t = "^";
    for (char c : s) {
        t += '#';
        t += c;
    }
    t += "#$";

    int n = t.size();
    vector<int> p(n);
    int center = 0, right = 0;
    for (int i = 1; i &lt; n - 1; i++) {
        int mirror = 2 * center - i;
        if (i &lt; right) p[i] = min(right - i, p[mirror]);
        while (t[i + p[i] + 1] == t[i - p[i] - 1]) p[i]++;
        if (i + p[i] &gt; right) {
            center = i;
            right = i + p[i];
        }
    }
    return p;
}</textarea></section></article></main><script src="../assets/jszip.min.js"></script><script src="../assets/index-data.js"></script><script src="../assets/app.js"></script></body></html>

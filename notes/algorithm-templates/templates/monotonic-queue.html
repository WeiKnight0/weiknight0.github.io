<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>单调队列：滑动窗口最大值 | 算法模板速查</title><link rel="icon" href="/favicon.ico" /><script src="../assets/color-theme.js"></script><link rel="stylesheet" href="../assets/styles.css" /></head><body data-page="template" data-site-root="../"><header class="site-header"><a class="brand" href="../index.html">算法模板速查</a><nav class="top-nav"><a href="../index.html">返回首页</a><a id="download-page" class="download-button" href="#" role="button">下载网页压缩包</a></nav></header><main class="page-shell"><article class="template-page"><p class="eyebrow">基础容器与技巧</p><h1>单调队列：滑动窗口最大值</h1><div class="tag-row"><span class="tag category">deque</span><span class="tag">灵神风格</span><span class="tag">滑动窗口最大值</span></div><section class="code-shell"><textarea class="template-source" readonly spellcheck="false">vector<int> maxSlidingWindow(vector<int>& nums, int k) {
    deque<int> q; // 维护下标，对应元素从队首到队尾单调递减
    vector<int> ans;
    for (int i = 0; i &lt; nums.size(); i++) {
        while (!q.empty() && nums[q.back()] &lt;= nums[i]) {
            q.pop_back();
        }
        q.push_back(i);
        if (i - q.front() &gt;= k) {
            q.pop_front();
        }
        if (i &gt;= k - 1) {
            ans.push_back(nums[q.front()]);
        }
    }
    return ans;
}</textarea></section></article></main><script src="../assets/jszip.min.js"></script><script src="../assets/index-data.js"></script><script src="../assets/app.js"></script></body></html>

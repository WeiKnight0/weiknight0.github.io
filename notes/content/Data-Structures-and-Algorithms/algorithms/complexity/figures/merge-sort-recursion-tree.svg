<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650" role="img" aria-labelledby="title desc">
  <title id="title">归并排序的递归树</title>
  <desc id="desc">递归式 T(n)=2T(n/2)+n 的递归树。每层的非递归工作量均为 n，共有约 log2 n 加一层。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#64748b"/>
    </marker>
  </defs>
  <style>
    .background{fill:#f8fafc}.edge{stroke:#94a3b8;stroke-width:2}.node{fill:#fff;stroke:#2563eb;stroke-width:2}.leaf{fill:#ecfdf5;stroke:#059669;stroke-width:2}.brace{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}.title{font:700 24px Arial,'Microsoft YaHei',sans-serif;fill:#0f172a}.text{font:600 17px Arial,'Microsoft YaHei',sans-serif;fill:#1e293b;text-anchor:middle}.level{font:16px Arial,'Microsoft YaHei',sans-serif;fill:#334155}.cost{font:600 17px Arial,'Microsoft YaHei',sans-serif;fill:#1d4ed8}.summary{font:700 19px Arial,'Microsoft YaHei',sans-serif;fill:#0f172a}
  </style>
  <rect class="background" width="1000" height="650" rx="16"/>
  <text class="title" x="40" y="45">T(n) = 2T(n/2) + n 的递归树</text>

  <line class="edge" x1="470" y1="100" x2="285" y2="190"/>
  <line class="edge" x1="530" y1="100" x2="715" y2="190"/>
  <line class="edge" x1="260" y1="230" x2="145" y2="320"/>
  <line class="edge" x1="310" y1="230" x2="385" y2="320"/>
  <line class="edge" x1="690" y1="230" x2="615" y2="320"/>
  <line class="edge" x1="740" y1="230" x2="855" y2="320"/>
  <line class="edge" x1="125" y1="360" x2="85" y2="495"/>
  <line class="edge" x1="165" y1="360" x2="205" y2="495"/>
  <line class="edge" x1="365" y1="360" x2="325" y2="495"/>
  <line class="edge" x1="405" y1="360" x2="445" y2="495"/>
  <line class="edge" x1="595" y1="360" x2="555" y2="495"/>
  <line class="edge" x1="635" y1="360" x2="675" y2="495"/>
  <line class="edge" x1="835" y1="360" x2="795" y2="495"/>
  <line class="edge" x1="875" y1="360" x2="915" y2="495"/>

  <rect class="node" x="420" y="70" width="160" height="48" rx="12"/>
  <text class="text" x="500" y="101">T(n) · 工作 n</text>

  <rect class="node" x="205" y="190" width="160" height="48" rx="12"/>
  <rect class="node" x="635" y="190" width="160" height="48" rx="12"/>
  <text class="text" x="285" y="221">T(n/2) · n/2</text>
  <text class="text" x="715" y="221">T(n/2) · n/2</text>

  <rect class="node" x="65" y="320" width="160" height="48" rx="12"/>
  <rect class="node" x="305" y="320" width="160" height="48" rx="12"/>
  <rect class="node" x="535" y="320" width="160" height="48" rx="12"/>
  <rect class="node" x="775" y="320" width="160" height="48" rx="12"/>
  <text class="text" x="145" y="351">T(n/4) · n/4</text>
  <text class="text" x="385" y="351">T(n/4) · n/4</text>
  <text class="text" x="615" y="351">T(n/4) · n/4</text>
  <text class="text" x="855" y="351">T(n/4) · n/4</text>

  <text class="level" x="485" y="425">⋮</text>

  <circle class="leaf" cx="85" cy="515" r="29"/><circle class="leaf" cx="205" cy="515" r="29"/>
  <circle class="leaf" cx="325" cy="515" r="29"/><circle class="leaf" cx="445" cy="515" r="29"/>
  <circle class="leaf" cx="555" cy="515" r="29"/><circle class="leaf" cx="675" cy="515" r="29"/>
  <circle class="leaf" cx="795" cy="515" r="29"/><circle class="leaf" cx="915" cy="515" r="29"/>
  <text class="text" x="85" y="521">T(1)</text><text class="text" x="205" y="521">T(1)</text>
  <text class="text" x="325" y="521">T(1)</text><text class="text" x="445" y="521">T(1)</text>
  <text class="text" x="555" y="521">T(1)</text><text class="text" x="675" y="521">T(1)</text>
  <text class="text" x="795" y="521">T(1)</text><text class="text" x="915" y="521">T(1)</text>

  <text class="level" x="40" y="98">第 0 层</text><text class="cost" x="820" y="98">本层总工作量：n</text>
  <text class="level" x="40" y="218">第 1 层</text><text class="cost" x="820" y="218">2 · n/2 = n</text>
  <text class="level" x="40" y="298">第 2 层</text><text class="cost" x="820" y="298">4 · n/4 = n</text>
  <path class="brace" d="M965 82 Q985 300 965 522"/>
  <text class="level" x="830" y="445">树高约为 log₂ n</text>
  <text class="level" x="40" y="465">叶子层</text>
  <text class="summary" x="500" y="610" text-anchor="middle">每层 Θ(n) × Θ(log n) 层 = Θ(n log n)</text>
</svg>

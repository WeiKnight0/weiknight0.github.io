<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Notes | WeiKnight</title>
    <meta name="description" content="WeiKnight's study notes." />
    <link rel="icon" href="/favicon.ico" />
    <script>
      if (localStorage.getItem('wkn-notes-outline') === 'collapsed') {
        document.documentElement.dataset.notesOutline = 'collapsed';
      }
    </script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Roboto:wght@400;500;700&display=swap" />
    <link rel="stylesheet" href="%BASE_URL%note.css" />
  </head>
  <body>
    <header class="navbar">
      <div class="navbar-container">
        <div class="navbar-brand">
          <a class="avatar-link" href="https://github.com/WeiKnight0">
            <img class="avatar" src="https://avatars.githubusercontent.com/u/84631479?v=4" alt="WeiKnight" />
          </a>
          <div class="navbar-info">
            <a class="name" href="https://github.com/WeiKnight0">WeiKnight</a>
            <div class="subject">Study Notes</div>
          </div>
          <a class="brand-home-link" href="/">
            <svg class="icon" aria-hidden="true"><use href="%BASE_URL%icons.svg#home"></use></svg>
            <span>Return to HomePage</span>
          </a>
        </div>
        <nav class="navbar-actions" aria-label="Notes navigation">
          <a class="nav-link" href="/">
            <svg class="icon" aria-hidden="true"><use href="%BASE_URL%icons.svg#compass"></use></svg>
            <span>Return Home</span>
          </a>
          <div class="account-menu" id="notes-account-menu">
            <a class="account-trigger" href="/profile/" aria-label="Personal center">
              <span class="account-avatar">
                <img id="notes-account-avatar" hidden alt="" />
                <span id="notes-account-initial">?</span>
              </span>
            </a>
            <div class="account-menu-panel">
              <a href="/profile/">Personal center</a>
              <a id="notes-account-admin" href="/admin/oc/" target="_blank" rel="noopener noreferrer" hidden>Administration</a>
              <button id="notes-sign-out" type="button">Sign out</button>
            </div>
          </div>
        </nav>
      </div>
    </header>

    <section class="title-section">
      <div class="title-container">
        <h1 class="chapter-title" id="note-title">Notes</h1>
        <div class="chapter-meta">
          <span class="chapter-date">
            <svg class="icon" aria-hidden="true"><use href="%BASE_URL%icons.svg#calendar"></use></svg>
            <time id="note-date"></time>
          </span>
          <span class="chapter-lang" id="note-language"></span>
          <div class="chapter-tags" id="note-tags"></div>
        </div>
      </div>
    </section>

    <main class="content-section">
      <div class="note-layout" id="note-layout">
        <aside class="note-outline" id="note-outline" aria-label="Table of contents" hidden>
          <a class="outline-parent-link" data-notes-back href="../" title="Back to Home">
            <svg class="icon" aria-hidden="true"><use href="%BASE_URL%icons.svg#parent"></use></svg>
            <span class="outline-parent-label">Back to Home</span>
          </a>
          <div class="outline-header">
            <span class="outline-title">On this page</span>
          </div>
          <nav class="outline-links" id="note-outline-links" aria-label="Headings in this note"></nav>
          <button class="outline-toggle" id="toggle-outline" type="button" aria-expanded="true">
            <svg class="icon" aria-hidden="true"><use href="%BASE_URL%icons.svg#chevron-left"></use></svg>
            <span class="visually-hidden">Collapse table of contents</span>
          </button>
        </aside>
        <article class="chapter-content">
          <div class="note-body" id="note-body">Loading…</div>
        </article>
      </div>
      <div class="note-tools">
        <button class="tool-btn" id="toggle-dark" type="button">
          <svg class="icon" aria-hidden="true"><use id="theme-icon" href="%BASE_URL%icons.svg#moon"></use></svg>
          <span>Dark Mode</span>
        </button>
        <button class="tool-btn" id="print-note" type="button">
          <svg class="icon" aria-hidden="true"><use href="%BASE_URL%icons.svg#print"></use></svg>
          <span>Print This Note</span>
        </button>
      </div>
    </main>

    <footer class="footer">
      <div class="footer-content">
        <div class="footer-main">
          <div class="footer-copy">
            <p class="footer-owner">© WeiKnight</p>
            <p>Personal notes and learning archive.</p>
          </div>
          <div class="footer-links">
            <a href="/about/">About</a>
            <a href="/privacy/" target="_blank" rel="noopener noreferrer">Privacy</a>
          </div>
        </div>
        <div class="footer-records" id="footer-records"></div>
      </div>
    </footer>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>

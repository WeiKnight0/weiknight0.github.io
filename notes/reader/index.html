<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Notes | WeiKnight</title>
    <meta name="description" content="WeiKnight's study notes." />
    <link rel="icon" href="%SITE_BASE_PATH%favicon.ico" />
    <script>
      const savedTheme = localStorage.getItem('wkn-color-theme');
      document.documentElement.dataset.theme = savedTheme === 'light' || savedTheme === 'dark'
        ? savedTheme
        : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      if (localStorage.getItem('wkn-notes-outline') === 'collapsed') {
        document.documentElement.dataset.notesOutline = 'collapsed';
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" />
    <link rel="stylesheet" href="/note.css" />
  </head>
  <body>
    <header class="navbar">
      <nav class="navbar-container" aria-label="Primary navigation">
        <a class="site-brand" href="%SITE_BASE_PATH%" data-localized-path="/">
          <img src="https://avatars.githubusercontent.com/u/84631479?v=4" alt="" />
          <span>WeiKnight</span>
        </a>
        <div class="site-nav-links">
          <a href="%SITE_BASE_PATH%" data-localized-path="/" data-nav-i18n="home">Home</a>
          <a href="%SITE_BASE_PATH%projects/" data-localized-path="/projects/" data-nav-i18n="projects">Projects</a>
          <a href="%SITE_BASE_PATH%notes/" aria-current="page" data-nav-i18n="notes">Notes</a>
          <a href="%SITE_BASE_PATH%ocs/" data-localized-path="/ocs/" data-nav-i18n="ocs">OCs</a>
          <a href="%SITE_BASE_PATH%worldbuilding/" data-localized-path="/worldbuilding/" data-nav-i18n="worldbuilding">Worldbuilding</a>
        </div>
        <div class="site-nav-actions">
          <button type="button" data-theme-toggle class="nav-icon-button" aria-label="Switch color theme"><span data-theme-icon aria-hidden="true">☼</span></button>
          <details class="language-control" data-dropdown>
            <summary aria-label="Language" aria-expanded="false"><span data-language-current>English</span></summary>
            <div class="language-menu">
              <a href="%SITE_BASE_PATH%notes/" data-language-link data-target-locale="en">English</a>
              <a href="%SITE_BASE_PATH%notes/" data-language-link data-target-locale="zh-cn">简体中文</a>
            </div>
          </details>
        </div>
        <details class="mobile-nav" data-dropdown>
          <summary aria-expanded="false" data-nav-i18n="menu">Menu</summary>
          <div class="mobile-nav-panel">
            <a href="%SITE_BASE_PATH%" data-localized-path="/" data-nav-i18n="home">Home</a>
            <a href="%SITE_BASE_PATH%projects/" data-localized-path="/projects/" data-nav-i18n="projects">Projects</a>
            <a href="%SITE_BASE_PATH%notes/" data-nav-i18n="notes">Notes</a>
            <a href="%SITE_BASE_PATH%ocs/" data-localized-path="/ocs/" data-nav-i18n="ocs">OCs</a>
            <a href="%SITE_BASE_PATH%worldbuilding/" data-localized-path="/worldbuilding/" data-nav-i18n="worldbuilding">Worldbuilding</a>
            <button type="button" data-theme-toggle><span data-theme-icon aria-hidden="true">☼</span><span data-theme-label>Theme</span></button>
            <div class="mobile-language" aria-label="Language">
              <a href="%SITE_BASE_PATH%notes/" data-language-link data-target-locale="en">English</a>
              <a href="%SITE_BASE_PATH%notes/" data-language-link data-target-locale="zh-cn">简体中文</a>
            </div>
          </div>
        </details>
      </nav>
    </header>

    <main class="content-section">
      <div class="note-layout" id="note-layout">
        <aside class="note-outline" id="note-outline" aria-label="Table of contents" hidden>
          <a class="outline-parent-link" data-notes-back href="../" title="Back to Home">
            <svg class="icon" aria-hidden="true"><use href="%BASE_URL%icons.svg#parent"></use></svg>
            <span class="outline-parent-label">Back to Home</span>
          </a>
          <div class="outline-header">
            <span class="outline-title">On this page</span>
          </div>
          <nav class="outline-links" id="note-outline-links" aria-label="Headings in this note"></nav>
          <button class="outline-toggle" id="toggle-outline" type="button" aria-expanded="true">
            <svg class="icon" aria-hidden="true"><use href="%BASE_URL%icons.svg#chevron-left"></use></svg>
            <span class="visually-hidden">Collapse table of contents</span>
          </button>
        </aside>
        <div class="note-article">
          <div class="title-section">
            <h1 class="chapter-title" id="note-title">Notes</h1>
            <div class="chapter-meta">
              <span class="chapter-date">
                <svg class="icon" aria-hidden="true"><use href="%BASE_URL%icons.svg#calendar"></use></svg>
                <time id="note-date"></time>
              </span>
              <span class="chapter-lang" id="note-language"></span>
              <div class="chapter-tags" id="note-tags"></div>
            </div>
          </div>
          <article class="chapter-content">
            <div class="note-body" id="note-body">Loading…</div>
          </article>
        </div>
      </div>
      <div class="note-tools">
        <a class="tool-btn" href="https://github.com/WeiKnight0" target="_blank" rel="noopener noreferrer">GitHub ↗</a>
        <button class="tool-btn" id="toggle-dark" type="button">
          <svg class="icon" aria-hidden="true"><use id="theme-icon" href="%BASE_URL%icons.svg#moon"></use></svg>
          <span>Dark Mode</span>
        </button>
        <button class="tool-btn" id="print-note" type="button">
          <svg class="icon" aria-hidden="true"><use href="%BASE_URL%icons.svg#print"></use></svg>
          <span>Print This Note</span>
        </button>
      </div>
    </main>

    <footer class="footer">
      <div class="footer-content">
        <div class="footer-main">
          <div class="footer-copy">
            <p class="footer-owner">© <span id="footer-year"></span> WeiKnight</p>
            <p data-footer-i18n="tagline">A personal archive for projects, notes and fictional worlds.</p>
          </div>
          <nav class="footer-links" aria-label="Footer">
            <a href="%SITE_BASE_PATH%about/" data-localized-path="/about/" data-footer-i18n="about">About this site</a>
            <a href="%SITE_BASE_PATH%privacy/" target="_blank" rel="noopener noreferrer" data-footer-i18n="privacy">Privacy</a>
          </nav>
        </div>
        <div class="footer-records" id="footer-records"></div>
      </div>
    </footer>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>

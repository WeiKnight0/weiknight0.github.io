<svg xmlns="http://www.w3.org/2000/svg" width="980" height="510" viewBox="0 0 980 510" role="img" aria-labelledby="title desc">
  <title id="title">AVL 树四种失衡与旋转</title>
  <desc id="desc">LL、RR、LR、RL 四种失衡对应的旋转方式。</desc>
  <style>.panel{fill:#f8fafc;stroke:#94a3b8;stroke-width:1.5}.edge{stroke:#475569;stroke-width:2}.node{fill:#fff;stroke:#2563eb;stroke-width:2}.hot{fill:#fee2e2;stroke:#dc2626;stroke-width:2}.txt{font:600 16px Arial,'Microsoft YaHei',sans-serif;fill:#1e293b}.label{font:600 18px Arial,'Microsoft YaHei',sans-serif;fill:#0f172a}.hint{font:14px Arial,'Microsoft YaHei',sans-serif;fill:#475569}</style>
  <rect class="panel" x="15" y="15" width="465" height="225" rx="12"/><rect class="panel" x="500" y="15" width="465" height="225" rx="12"/><rect class="panel" x="15" y="270" width="465" height="225" rx="12"/><rect class="panel" x="500" y="270" width="465" height="225" rx="12"/>
  <text class="label" x="35" y="45">LL：对 A 右旋</text><line class="edge" x1="135" y1="85" x2="85" y2="135"/><line class="edge" x1="135" y1="85" x2="185" y2="135"/><line class="edge" x1="85" y1="135" x2="55" y2="185"/><circle class="hot" cx="135" cy="85" r="19"/><circle class="node" cx="85" cy="135" r="19"/><circle class="node" cx="185" cy="135" r="19"/><circle class="node" cx="55" cy="185" r="19"/><text class="txt" x="129" y="91">A</text><text class="txt" x="79" y="141">B</text><text class="txt" x="179" y="141">T3</text><text class="txt" x="49" y="191">T1</text><text class="hint" x="230" y="140">B 提升，A 成为 B 的右孩子</text>
  <text class="label" x="520" y="45">RR：对 A 左旋</text><line class="edge" x1="635" y1="85" x2="585" y2="135"/><line class="edge" x1="635" y1="85" x2="685" y2="135"/><line class="edge" x1="685" y1="135" x2="715" y2="185"/><circle class="hot" cx="635" cy="85" r="19"/><circle class="node" cx="585" cy="135" r="19"/><circle class="node" cx="685" cy="135" r="19"/><circle class="node" cx="715" cy="185" r="19"/><text class="txt" x="629" y="91">A</text><text class="txt" x="579" y="141">T1</text><text class="txt" x="679" y="141">B</text><text class="txt" x="709" y="191">T3</text><text class="hint" x="750" y="140">B 提升，A 成为 B 的左孩子</text>
  <text class="label" x="35" y="300">LR：先对 B 左旋，再对 A 右旋</text><line class="edge" x1="145" y1="340" x2="95" y2="390"/><line class="edge" x1="95" y1="390" x2="125" y2="440"/><circle class="hot" cx="145" cy="340" r="19"/><circle class="node" cx="95" cy="390" r="19"/><circle class="node" cx="125" cy="440" r="19"/><text class="txt" x="139" y="346">A</text><text class="txt" x="89" y="396">B</text><text class="txt" x="119" y="446">C</text><text class="hint" x="205" y="395">把折线拉直，再按 LL 修复</text>
  <text class="label" x="520" y="300">RL：先对 B 右旋，再对 A 左旋</text><line class="edge" x1="635" y1="340" x2="685" y2="390"/><line class="edge" x1="685" y1="390" x2="655" y2="440"/><circle class="hot" cx="635" cy="340" r="19"/><circle class="node" cx="685" cy="390" r="19"/><circle class="node" cx="655" cy="440" r="19"/><text class="txt" x="629" y="346">A</text><text class="txt" x="679" y="396">B</text><text class="txt" x="649" y="446">C</text><text class="hint" x="745" y="395">把折线拉直，再按 RR 修复</text>
</svg>

<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>0-1 Trie：最大异或与删除 | 算法模板速查</title><link rel="icon" href="/favicon.ico" /><link rel="stylesheet" href="../assets/styles.css" /></head><body data-page="template" data-site-root="../"><header class="site-header"><a class="brand" href="../index.html">算法模板速查</a><nav class="top-nav"><a href="../index.html">返回首页</a><a id="download-page" class="download-button" href="#" role="button">下载网页压缩包</a></nav></header><main class="page-shell"><article class="template-page"><p class="eyebrow">位运算</p><h1>0-1 Trie：最大异或与删除</h1><div class="tag-row"><span class="tag category">灵神风格</span><span class="tag">XOR</span><span class="tag">cnt</span></div><section class="code-shell"><textarea class="template-source" readonly spellcheck="false">class XorTrie {
    static const int HIGH_BIT = 30;

    struct Node {
        Node* son[2]{};
        int cnt = 0;
    };

    Node* root = new Node();

public:
    void insert(int val) {
        Node* cur = root;
        cur-&gt;cnt++;
        for (int i = HIGH_BIT; i &gt;= 0; i--) {
            int bit = val &gt;&gt; i & 1;
            if (cur-&gt;son[bit] == nullptr) {
                cur-&gt;son[bit] = new Node();
            }
            cur = cur-&gt;son[bit];
            cur-&gt;cnt++;
        }
    }

    void remove(int val) {
        Node* cur = root;
        cur-&gt;cnt--;
        for (int i = HIGH_BIT; i &gt;= 0; i--) {
            int bit = val &gt;&gt; i & 1;
            cur = cur-&gt;son[bit];
            cur-&gt;cnt--;
        }
    }

    int maxXor(int val) {
        Node* cur = root;
        int ans = 0;
        for (int i = HIGH_BIT; i &gt;= 0; i--) {
            int bit = val &gt;&gt; i & 1;
            if (cur-&gt;son[bit ^ 1] && cur-&gt;son[bit ^ 1]-&gt;cnt &gt; 0) {
                ans |= 1 &lt;&lt; i;
                bit ^= 1;
            }
            cur = cur-&gt;son[bit];
        }
        return ans;
    }
};</textarea></section></article></main><script src="../assets/jszip.min.js"></script><script src="../assets/index-data.js"></script><script src="../assets/app.js"></script></body></html>

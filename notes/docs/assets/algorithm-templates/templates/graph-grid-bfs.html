<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>网格图 BFS：最短距离 | 算法模板速查</title><link rel="icon" href="/favicon.ico" /><link rel="stylesheet" href="../assets/styles.css" /></head><body data-page="template" data-site-root="../"><header class="site-header"><a class="brand" href="../index.html">算法模板速查</a><nav class="top-nav"><a href="../index.html">返回首页</a><a id="download-page" class="download-button" href="#" role="button">下载网页压缩包</a></nav></header><main class="page-shell"><article class="template-page"><p class="eyebrow">图论</p><h1>网格图 BFS：最短距离</h1><div class="tag-row"><span class="tag category">灵神风格</span><span class="tag">网格图</span><span class="tag">BFS</span></div><section class="code-shell"><textarea class="template-source" readonly spellcheck="false">int DIRS[5] = {-1, 0, 1, 0, -1};

int shortestPath(vector<vector<int>>& grid, int sx, int sy, int tx, int ty) {
    int m = grid.size(), n = grid[0].size();
    vector<vector<int>> dis(m, vector<int>(n, -1));
    queue<pair<int, int>> q;
    dis[sx][sy] = 0;
    q.emplace(sx, sy);

    while (!q.empty()) {
        auto [i, j] = q.front();
        q.pop();
        if (i == tx && j == ty) {
            return dis[i][j];
        }
        for (int k = 0; k &lt; 4; k++) {
            int x = i + DIRS[k], y = j + DIRS[k + 1];
            if (0 &lt;= x && x &lt; m && 0 &lt;= y && y &lt; n && grid[x][y] == 0 && dis[x][y] &lt; 0) {
                dis[x][y] = dis[i][j] + 1;
                q.emplace(x, y);
            }
        }
    }
    return -1;
}</textarea></section></article></main><script src="../assets/jszip.min.js"></script><script src="../assets/index-data.js"></script><script src="../assets/app.js"></script></body></html>

<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>一维差分：区间加法 | 算法模板速查</title><link rel="icon" href="/favicon.ico" /><link rel="stylesheet" href="../assets/styles.css" /></head><body data-page="template" data-site-root="../"><header class="site-header"><a class="brand" href="../index.html">算法模板速查</a><nav class="top-nav"><a href="../index.html">返回首页</a><a id="download-page" class="download-button" href="#" role="button">下载网页压缩包</a></nav></header><main class="page-shell"><article class="template-page"><p class="eyebrow">基础容器与技巧</p><h1>一维差分：区间加法</h1><div class="tag-row"><span class="tag category">差分</span><span class="tag">区间更新</span><span class="tag">前缀还原</span></div><section class="code-shell"><textarea class="template-source" readonly spellcheck="false">vector<long long> rangeAdd(int n, vector<array<int, 3>>& queries) {
    vector<long long> diff(n + 1);
    for (auto [l, r, v] : queries) {
        diff[l] += v;
        if (r + 1 &lt; n) diff[r + 1] -= v;
    }
    vector<long long> ans(n);
    long long cur = 0;
    for (int i = 0; i &lt; n; i++) {
        cur += diff[i];
        ans[i] = cur;
    }
    return ans;
}</textarea></section></article></main><script src="../assets/jszip.min.js"></script><script src="../assets/index-data.js"></script><script src="../assets/app.js"></script></body></html>

// 循环结束时 right 是最小的满足要求的答案
long long binarySearchMin(long long left, long long right) {
    auto check = [&](long long x) -&gt; bool {
        // TODO: 判断 x 是否满足要求
        return true;
    };

    while (left + 1 &lt; right) {
        long long mid = left + (right - left) / 2;
        if (check(mid)) {
            right = mid;
        } else {
            left = mid;
        }
    }
    return right;
}</textarea></section></article></main><script src="../assets/jszip.min.js"></script><script src="../assets/index-data.js"></script><script src="../assets/app.js"></script></body></html>

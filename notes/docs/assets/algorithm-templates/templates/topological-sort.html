<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>拓扑排序：Kahn 入度法 | 算法模板速查</title><link rel="icon" href="/favicon.ico" /><link rel="stylesheet" href="../assets/styles.css" /></head><body data-page="template" data-site-root="../"><header class="site-header"><a class="brand" href="../index.html">算法模板速查</a><nav class="top-nav"><a href="../index.html">返回首页</a><a id="download-page" class="download-button" href="#" role="button">下载网页压缩包</a></nav></header><main class="page-shell"><article class="template-page"><p class="eyebrow">图论</p><h1>拓扑排序：Kahn 入度法</h1><div class="tag-row"><span class="tag category">课程表</span><span class="tag">入度</span><span class="tag">DAG</span></div><section class="code-shell"><textarea class="template-source" readonly spellcheck="false">vector<int> topoSort(int n, vector<vector<int>>& edges) {
    vector<vector<int>> graph(n);
    vector<int> indeg(n, 0);

    for (auto& e : edges) {
        int from = e[0], to = e[1];
        graph[from].push_back(to);
        indeg[to]++;
    }

    queue<int> q;
    for (int i = 0; i < n; i++) {
        if (indeg[i] == 0) q.push(i);
    }

    vector<int> order;
    while (!q.empty()) {
        int u = q.front();
        q.pop();
        order.push_back(u);

        for (int v : graph[u]) {
            if (--indeg[v] == 0) q.push(v);
        }
    }

    return order.size() == n ? order : vector<int>{};
}</textarea></section></article></main><script src="../assets/jszip.min.js"></script><script src="../assets/index-data.js"></script><script src="../assets/app.js"></script></body></html>

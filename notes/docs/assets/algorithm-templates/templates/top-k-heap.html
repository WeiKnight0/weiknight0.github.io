<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Top K 高频：大根堆 | 算法模板速查</title><link rel="icon" href="/favicon.ico" /><link rel="stylesheet" href="../assets/styles.css" /></head><body data-page="template" data-site-root="../"><header class="site-header"><a class="brand" href="../index.html">算法模板速查</a><nav class="top-nav"><a href="../index.html">返回首页</a><a id="download-page" class="download-button" href="#" role="button">下载网页压缩包</a></nav></header><main class="page-shell"><article class="template-page"><p class="eyebrow">堆与优先队列</p><h1>Top K 高频：大根堆</h1><div class="tag-row"><span class="tag category">Hot100 347</span><span class="tag">priority_queue</span><span class="tag">TopK</span></div><section class="code-shell"><textarea class="template-source" readonly spellcheck="false">vector&lt;int&gt; topKFrequent(vector&lt;int&gt;&amp; nums, int k) {
    unordered_map&lt;int, int&gt; mp;
    for (auto x : nums) {
        mp[x]++;
    }

    priority_queue&lt;pair&lt;int, int&gt;, vector&lt;pair&lt;int, int&gt;&gt;, less&lt;pair&lt;int, int&gt;&gt;&gt; q;
    for (auto [x1, x2] : mp) {
        q.push({x2, x1});
    }

    vector&lt;int&gt; ans;
    while (k &amp;&amp; !q.empty()) {
        ans.push_back(q.top().second);
        q.pop();
        k--;
    }
    return ans;
}</textarea></section></article></main><script src="../assets/jszip.min.js"></script><script src="../assets/index-data.js"></script><script src="../assets/app.js"></script></body></html>

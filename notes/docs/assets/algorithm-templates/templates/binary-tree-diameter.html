<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>二叉树直径：后序返回高度 | 算法模板速查</title><link rel="icon" href="/favicon.ico" /><link rel="stylesheet" href="../assets/styles.css" /></head><body data-page="template" data-site-root="../"><header class="site-header"><a class="brand" href="../index.html">算法模板速查</a><nav class="top-nav"><a href="../index.html">返回首页</a><a id="download-page" class="download-button" href="#" role="button">下载网页压缩包</a></nav></header><main class="page-shell"><article class="template-page"><p class="eyebrow">二叉树</p><h1>二叉树直径：后序返回高度</h1><div class="tag-row"><span class="tag category">直径</span><span class="tag">后序</span><span class="tag">高度</span></div><section class="code-shell"><textarea class="template-source" readonly spellcheck="false">int diameterOfBinaryTree(TreeNode* root) {
    int ans = 0;
    function<int(TreeNode*)> height = [&](TreeNode* node) {
        if (!node) return 0;
        int left = height(node-&gt;left);
        int right = height(node-&gt;right);
        ans = max(ans, left + right);
        return max(left, right) + 1;
    };
    height(root);
    return ans;
}</textarea></section></article></main><script src="../assets/jszip.min.js"></script><script src="../assets/index-data.js"></script><script src="../assets/app.js"></script></body></html>

<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>最小字典序：单调栈去重 | 算法模板速查</title><link rel="icon" href="/favicon.ico" /><link rel="stylesheet" href="../assets/styles.css" /></head><body data-page="template" data-site-root="../"><header class="site-header"><a class="brand" href="../index.html">算法模板速查</a><nav class="top-nav"><a href="../index.html">返回首页</a><a id="download-page" class="download-button" href="#" role="button">下载网页压缩包</a></nav></header><main class="page-shell"><article class="template-page"><p class="eyebrow">栈与单调栈</p><h1>最小字典序：单调栈去重</h1><div class="tag-row"><span class="tag category">字典序</span><span class="tag">去重</span><span class="tag">贪心</span></div><section class="code-shell"><textarea class="template-source" readonly spellcheck="false">string removeDuplicateLetters(string s) {
    vector<int> last(26), inStack(26);
    for (int i = 0; i &lt; (int) s.size(); i++) last[s[i] - 'a'] = i;

    string st;
    for (int i = 0; i &lt; (int) s.size(); i++) {
        int x = s[i] - 'a';
        if (inStack[x]) continue;
        while (!st.empty() && st.back() &gt; s[i] && last[st.back() - 'a'] &gt; i) {
            inStack[st.back() - 'a'] = 0;
            st.pop_back();
        }
        st.push_back(s[i]);
        inStack[x] = 1;
    }
    return st;
}</textarea></section></article></main><script src="../assets/jszip.min.js"></script><script src="../assets/index-data.js"></script><script src="../assets/app.js"></script></body></html>

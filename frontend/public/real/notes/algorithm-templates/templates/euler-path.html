<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>欧拉路径：Hierholzer 算法 | 算法模板速查</title><link rel="icon" href="/favicon.ico" /><link rel="stylesheet" href="../assets/styles.css" /></head><body data-page="template" data-site-root="../"><header class="site-header"><a class="brand" href="../index.html">算法模板速查</a><nav class="top-nav"><a href="../index.html">返回首页</a><a id="download-page" class="download-button" href="#" role="button">下载网页压缩包</a></nav></header><main class="page-shell"><article class="template-page"><p class="eyebrow">图论</p><h1>欧拉路径：Hierholzer 算法</h1><div class="tag-row"><span class="tag category">欧拉路径</span><span class="tag">Hierholzer</span><span class="tag">有向图</span></div><section class="code-shell"><textarea class="template-source" readonly spellcheck="false">vector<int> eulerPath(int n, vector<vector<int>>& edges, int start) {
    vector<vector<int>> g(n);
    for (auto& e : edges) g[e[0]].push_back(e[1]);
    vector<int> idx(n), path;

    function<void(int)> dfs = [&](int x) {
        while (idx[x] &lt; (int) g[x].size()) {
            int y = g[x][idx[x]++];
            dfs(y);
        }
        path.push_back(x);
    };
    dfs(start);
    reverse(path.begin(), path.end());
    return path;
}</textarea></section></article></main><script src="../assets/jszip.min.js"></script><script src="../assets/index-data.js"></script><script src="../assets/app.js"></script></body></html>

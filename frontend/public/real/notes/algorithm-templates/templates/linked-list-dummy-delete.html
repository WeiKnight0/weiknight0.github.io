<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>链表删除：哨兵节点 | 算法模板速查</title><link rel="icon" href="/favicon.ico" /><link rel="stylesheet" href="../assets/styles.css" /></head><body data-page="template" data-site-root="../"><header class="site-header"><a class="brand" href="../index.html">算法模板速查</a><nav class="top-nav"><a href="../index.html">返回首页</a><a id="download-page" class="download-button" href="#" role="button">下载网页压缩包</a></nav></header><main class="page-shell"><article class="template-page"><p class="eyebrow">链表</p><h1>链表删除：哨兵节点</h1><div class="tag-row"><span class="tag category">dummy</span><span class="tag">删除节点</span><span class="tag">链表</span></div><section class="code-shell"><textarea class="template-source" readonly spellcheck="false">ListNode* removeElements(ListNode* head, int val) {
    ListNode dummy(0, head);
    ListNode* cur = &dummy;
    while (cur-&gt;next) {
        if (cur-&gt;next-&gt;val == val) {
            cur-&gt;next = cur-&gt;next-&gt;next;
        } else {
            cur = cur-&gt;next;
        }
    }
    return dummy.next;
}</textarea></section></article></main><script src="../assets/jszip.min.js"></script><script src="../assets/index-data.js"></script><script src="../assets/app.js"></script></body></html>

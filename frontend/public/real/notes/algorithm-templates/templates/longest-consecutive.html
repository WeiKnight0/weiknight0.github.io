<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>最长连续序列：只从起点扩展 | 算法模板速查</title><link rel="icon" href="/favicon.ico" /><link rel="stylesheet" href="../assets/styles.css" /></head><body data-page="template" data-site-root="../"><header class="site-header"><a class="brand" href="../index.html">算法模板速查</a><nav class="top-nav"><a href="../index.html">返回首页</a><a id="download-page" class="download-button" href="#" role="button">下载网页压缩包</a></nav></header><main class="page-shell"><article class="template-page"><p class="eyebrow">数组与哈希</p><h1>最长连续序列：只从起点扩展</h1><div class="tag-row"><span class="tag category">Hot100 128</span><span class="tag">unordered_set</span><span class="tag">连续序列</span></div><section class="code-shell"><textarea class="template-source" readonly spellcheck="false">int longestConsecutive(vector<int>& nums) {
    unordered_set<int> st(nums.begin(), nums.end());
    int ans = 0;

    for (int x : st) {
        if (st.count(x - 1)) continue;

        int y = x;
        while (st.count(y)) y++;
        ans = max(ans, y - x);
    }

    return ans;
}</textarea></section></article></main><script src="../assets/jszip.min.js"></script><script src="../assets/index-data.js"></script><script src="../assets/app.js"></script></body></html>

<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>划分 DP：枚举最后一段 | 算法模板速查</title><link rel="icon" href="/favicon.ico" /><link rel="stylesheet" href="../assets/styles.css" /></head><body data-page="template" data-site-root="../"><header class="site-header"><a class="brand" href="../index.html">算法模板速查</a><nav class="top-nav"><a href="../index.html">返回首页</a><a id="download-page" class="download-button" href="#" role="button">下载网页压缩包</a></nav></header><main class="page-shell"><article class="template-page"><p class="eyebrow">动态规划</p><h1>划分 DP：枚举最后一段</h1><div class="tag-row"><span class="tag category">灵神风格</span><span class="tag">最后一段</span><span class="tag">前缀</span></div><section class="code-shell"><textarea class="template-source" readonly spellcheck="false">// f[i] 表示 nums[0..i-1] 的最优值，枚举最后一段 nums[j..i-1]
int partitionDp(vector<int>& nums) {
    int n = nums.size();
    const int INF = INT_MAX / 2;
    vector<int> f(n + 1, INF);
    f[0] = 0;

    for (int i = 1; i &lt;= n; i++) {
        int cost = 0;
        for (int j = i - 1; j &gt;= 0; j--) {
            // TODO: 增量维护最后一段 nums[j..i-1] 的代价
            cost += nums[j];
            f[i] = min(f[i], f[j] + cost);
        }
    }
    return f[n];
}

// 若最后一段长度最多为 k，内层从 i-1 枚举到 max(0,i-k)
int partitionDpWithLimit(vector<int>& nums, int k) {
    int n = nums.size();
    vector<int> f(n + 1, INT_MIN / 2);
    f[0] = 0;
    for (int i = 1; i &lt;= n; i++) {
        int mx = 0;
        for (int j = i - 1; j &gt;= max(0, i - k); j--) {
            mx = max(mx, nums[j]);
            f[i] = max(f[i], f[j] + mx * (i - j));
        }
    }
    return f[n];
}</textarea></section></article></main><script src="../assets/jszip.min.js"></script><script src="../assets/index-data.js"></script><script src="../assets/app.js"></script></body></html>

<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>二分图染色：DFS 交替染色 | 算法模板速查</title><link rel="icon" href="/favicon.ico" /><link rel="stylesheet" href="../assets/styles.css" /></head><body data-page="template" data-site-root="../"><header class="site-header"><a class="brand" href="../index.html">算法模板速查</a><nav class="top-nav"><a href="../index.html">返回首页</a><a id="download-page" class="download-button" href="#" role="button">下载网页压缩包</a></nav></header><main class="page-shell"><article class="template-page"><p class="eyebrow">图论</p><h1>二分图染色：DFS 交替染色</h1><div class="tag-row"><span class="tag category">二分图</span><span class="tag">染色</span><span class="tag">DFS</span></div><section class="code-shell"><textarea class="template-source" readonly spellcheck="false">bool isBipartite(vector<vector<int>>& graph) {
    int n = graph.size();
    vector<int> color(n);

    function<bool(int, int)> dfs = [&](int x, int c) {
        color[x] = c;
        for (int y : graph[x]) {
            if (color[y] == c) return false;
            if (color[y] == 0 && !dfs(y, -c)) return false;
        }
        return true;
    };

    for (int i = 0; i &lt; n; i++) {
        if (color[i] == 0 && !dfs(i, 1)) return false;
    }
    return true;
}</textarea></section></article></main><script src="../assets/jszip.min.js"></script><script src="../assets/index-data.js"></script><script src="../assets/app.js"></script></body></html>

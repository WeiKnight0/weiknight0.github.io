services:
  postgres:
    image: wkn-personal-site-postgres
    build:
      context: ./postgres
    user: "1000:1000"
    restart: unless-stopped
    environment:
      POSTGRES_DB: wkn_site
      POSTGRES_USER: wkn
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-before-production}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    mem_limit: 256m
    cpus: 0.5

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    user: "1000:1000"
    environment:
      SERVER_PORT: "8080"
      DATABASE_URL: jdbc:postgresql://postgres:5432/wkn_site
      DATABASE_USERNAME: wkn
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-change-me-before-production}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me-before-production}
    # Fits a small 2 GB server while leaving capacity for Docker and the OS.
    mem_limit: 512m
    cpus: 1.0
    depends_on:
      - postgres
    volumes:
      - ./data/user-avatars:/data/user-avatars
      - ./data/fiction-assets:/data/fiction-assets
      - ./notes/docs:/data/notes:ro

  nginx:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        SITE_URL: ${SITE_URL:-http://localhost}
    restart: unless-stopped
    user: "1000:1000"
    depends_on:
      - backend
    ports:
      - "${HTTP_PORT:-80}:8080"
    volumes:
      - ./notes/docs:/usr/share/nginx/html/__notes_source:ro
    mem_limit: 128m
    cpus: 0.5

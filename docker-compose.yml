services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: wkn_site
      POSTGRES_USER: wkn
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-before-production}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    mem_limit: 256m
    cpus: 0.5

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      SERVER_PORT: "8080"
      DATABASE_URL: jdbc:postgresql://postgres:5432/wkn_site
      DATABASE_USERNAME: wkn
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-change-me-before-production}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me-before-production}
    # Fits a small 2 GB server while leaving capacity for Docker and the OS.
    mem_limit: 512m
    cpus: 1.0
    depends_on:
      - postgres
    volumes:
      - ./notes:/workspace/notes

  docs-builder:
    build:
      context: ./notes
    restart: "no"
    working_dir: /workspace
    entrypoint: []
    volumes:
      - ./notes:/workspace
    command: ["/bin/sh", "-c", "mkdocs build --clean || exit $?; while true; do if [ -f .publish ]; then rm .publish; mkdocs build --clean || exit $?; fi; sleep 2; done"]
    mem_limit: 128m

  nginx:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        SITE_URL: ${SITE_URL:-http://localhost}
    restart: unless-stopped
    depends_on:
      - backend
      - docs-builder
    volumes:
      - ./notes/site:/usr/share/nginx/notes:ro
    ports:
      - "${HTTP_PORT:-80}:80"
    mem_limit: 128m
    cpus: 0.5

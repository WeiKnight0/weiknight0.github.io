name: Deploy GitHub Pages

on:
  push:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Configure Pages
        if: github.ref == 'refs/heads/main'
        id: pages
        uses: actions/configure-pages@v5
      - name: Resolve site URL
        id: site
        env:
          PAGES_ORIGIN: ${{ steps.pages.outputs.origin }}
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const [owner, repository] = process.env.GITHUB_REPOSITORY.split('/');
          const isMain = process.env.GITHUB_REF === 'refs/heads/main';
          const origin = isMain ? process.env.PAGES_ORIGIN : `https://${owner.toLowerCase()}.github.io`;
          const base = isMain
            ? (process.env.PAGES_BASE_PATH || '/')
            : (repository.toLowerCase() === `${owner.toLowerCase()}.github.io` ? '/' : `/${repository}/`);
          if (!origin) throw new Error('Pages URL is unavailable. Set Settings > Pages > Source to GitHub Actions.');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `origin=${origin}\nbase=${base}\n`);
          NODE
      - run: npm ci
      - run: npm run check
      - name: Build static site
        run: npm run build
        env:
          SITE_URL: ${{ steps.site.outputs.origin }}
          SITE_BASE_PATH: ${{ steps.site.outputs.base }}
          NOTES_SITE_URL: https://weiknight0.github.io/notes/
      - run: npm run verify
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

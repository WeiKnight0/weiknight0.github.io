server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    return 301 https://$host$request_uri;
}

server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    server_name _;

    ssl_certificate /etc/nginx/certs/localhost.crt;
    ssl_certificate_key /etc/nginx/certs/localhost.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 10m;

    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; connect-src 'self'; font-src 'self' data: https://fonts.gstatic.com" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    root /usr/share/nginx/html;
    index index.html;
    error_page 404 /404.html;
    # Preserve the address used by a reverse proxy or port-forwarding rule.
    # Directory redirects such as /admin -> /admin/ stay relative.
    absolute_redirect off;

    # Fingerprinted Astro assets can be cached indefinitely.
    location /_astro/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location /js/ {
        try_files $uri =404;
        add_header Cache-Control "no-store";
    }
    location ^~ /notes-reader/ {
        auth_request /_notes_auth;
        error_page 401 403 = @notes_login;
        try_files $uri =404;
    }

    # API requests are forwarded to the Spring Boot service. Keeping the URI
    # unchanged means /api/health reaches the backend as /api/health.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /api/v1/auth/login {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /api/v1/auth/login-form {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /_notes_auth {
        internal;
        proxy_pass http://backend:8080/api/v1/auth/session;
    }
    location = /real/notes {
        proxy_pass http://backend:8080/api/v1/notes/page;
        proxy_intercept_errors on;
        error_page 401 403 = @notes_login;
        error_page 404 /404.html;
    }
    location = /real/notes/ {
        proxy_pass http://backend:8080/api/v1/notes/page;
        proxy_intercept_errors on;
        error_page 401 403 = @notes_login;
        error_page 404 /404.html;
    }
    location = /real/notes/algorithm-templates {
        auth_request /_notes_auth;
        error_page 401 403 = @notes_login;
        try_files /real/notes/algorithm-templates/index.html =404;
    }
    location ^~ /real/notes/algorithm-templates/ {
        auth_request /_notes_auth;
        error_page 401 403 = @notes_login;
        try_files $uri $uri/index.html =404;
    }
    location ~* ^/real/notes/(?<note_asset>.+\.(?:png|jpe?g|gif|webp|svg|avif))$ {
        auth_request /_notes_auth;
        error_page 401 403 = @notes_login;
        alias /usr/share/nginx/html/__notes_source/$note_asset;
    }
    location ~ ^/real/notes/(?<note_path>.+?)/?$ {
        proxy_pass http://backend:8080/api/v1/notes/page?path=$note_path;
        proxy_intercept_errors on;
        error_page 401 403 = @notes_login;
        error_page 404 /404.html;
    }
    location @notes_login { return 302 /login/?next=$request_uri; }
    location = /internal/notes-reader/ {
        internal;
        try_files /notes-reader/index.html =404;
    }

    # Newly-created blogs do not have their own Astro build artifact. Serve a
    # shared article shell and let it load the post from the backend API.
    location ~ ^/real/blog/[^/]+/?$ {
        try_files $uri $uri/ /real/blog/post-view/index.html;
    }

    # Spring Boot validates dynamic Fiction slugs before the internal reader is served.
    location ~ ^/fiction/novels/(?<novel_slug>[a-z0-9]+(?:-[a-z0-9]+)*)/(?<chapter_slug>[a-z0-9]+(?:-[a-z0-9]+)*)/?$ {
        rewrite ^ /api/v1/fiction/page/novels/$novel_slug/$chapter_slug break;
        proxy_pass http://backend:8080;
        proxy_intercept_errors on;
        proxy_set_header Host $host;
    }
    location ~ ^/fiction/(?<fiction_kind>novels|oc)/(?<fiction_slug>[a-z0-9]+(?:-[a-z0-9]+)*)/?$ {
        rewrite ^ /api/v1/fiction/page/$fiction_kind/$fiction_slug break;
        proxy_pass http://backend:8080;
        proxy_intercept_errors on;
        proxy_set_header Host $host;
    }
    location ^~ /internal/ {
        internal;
        try_files $uri $uri/ =404;
    }
    location = /404.html {
        internal;
        try_files /404.html =404;
    }

    # Serve these static route entrypoints directly, including when callers
    # omit the trailing slash (important behind port-forwarding proxies).
    location = /admin { return 302 /admin/blogs/; }
    location = /admin/ { return 302 /admin/blogs/; }

    location = /admin/blogs {
        try_files /admin/blogs/index.html =404;
    }

    location = /admin/users {
        try_files /admin/users/index.html =404;
    }

    location = /admin/novels {
        try_files /admin/novels/index.html =404;
    }

    location = /admin/oc {
        try_files /admin/oc/index.html =404;
    }

    location = /admin/commissions {
        try_files /admin/commissions/index.html =404;
    }

    location = /admin/security {
        try_files /admin/security/index.html =404;
    }

    location = /login {
        try_files /login/index.html =404;
    }

    # Astro emits static HTML for every route. Do not fall back to the home
    # page: an unknown path must remain a real 404 instead of looking valid.
    location / {
        try_files $uri $uri/ =404;
    }
}

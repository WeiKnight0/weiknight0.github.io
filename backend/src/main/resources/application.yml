server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework

spring:
  application:
    name: wkn-personal-site-backend
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/wkn_site}
    username: ${DATABASE_USERNAME:wkn}
    password: ${DATABASE_PASSWORD:change-me}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

site:
  note-assets-root: ${NOTE_ASSETS_ROOT:/data/note-assets}
  legacy-notes-root: ${LEGACY_NOTES_ROOT:/data/legacy-notes}
